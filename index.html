}

function bindStudy(){
  elStudy.querySelectorAll("[data-mode]").forEach(function(b){
    b.addEventListener("click", function(){
      if(study.mode === b.dataset.mode) return;
      study.mode = b.dataset.mode;
      loadQuestion(); renderStudy();
    });
  });
  elStudy.querySelectorAll("[data-order]").forEach(function(b){
    b.addEventListener("click", function(){
      if(study.order === b.dataset.order) return;
      study.order = b.dataset.order;
      buildList(); renderStudy();
    });
  });
  elStudy.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click", function(){ studyAction(b.dataset.act); });
  });

  var stem = document.getElementById("stem");
  if(!stem) return;

  if(study.mode === "fill"){
    var inputs = stem.querySelectorAll(".slot-fill");
    inputs.forEach(function(inp, i){
      sizeInput(inp);
      inp.addEventListener("input", function(){
        study.answers[inp.dataset.key] = inp.value;
        sizeInput(inp);
      });
      inp.addEventListener("keydown", function(e){
        if(e.key !== "Enter") return;
        e.preventDefault();
        if(i + 1 < inputs.length) inputs[i+1].focus();
        else studyAction(study.checked || study.revealed ? "next" : "check");
      });
    });
    if(!study.checked && !study.revealed && inputs.length) inputs[0].focus();
  }else{
    stem.querySelectorAll(".slot-drop").forEach(function(slot){
      slot.addEventListener("click", function(){ slotClick(slot.dataset.key); });
      slot.addEventListener("dragover", function(e){ e.preventDefault(); slot.classList.add("over"); });
      slot.addEventListener("dragleave", function(){ slot.classList.remove("over"); });
      slot.addEventListener("drop", function(e){
        e.preventDefault(); slot.classList.remove("over");
        var i = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(i)) place(i, slot.dataset.key);
      });
    });
    elStudy.querySelectorAll(".chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        var i = +chip.dataset.i;
        study.sel = (study.sel === i) ? null : i;
        renderStudy();
      });
      chip.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", chip.dataset.i);
        e.dataTransfer.effectAllowed = "move";
        study.sel = +chip.dataset.i;
      });
    });
  }
}
function sizeInput(inp){
  var n = Math.max(slotMin(), inp.value.length * 1.15 + 1.6);
  inp.style.width = n + "em";
}
function place(i, key){
  if(study.checked || study.revealed) return;
  if(study.usedIdx[i]) return;
  var prev = study.placed[key];
  if(prev != null) delete study.usedIdx[prev];
  study.placed[key] = i;
  study.usedIdx[i] = true;
  study.answers[key] = study.tray[i];
  study.sel = null;
  renderStudy();
}
function slotClick(key){
  if(study.checked || study.revealed) return;
  if(study.sel != null && !study.usedIdx[study.sel]){ place(study.sel, key); return; }
  var prev = study.placed[key];
  if(prev != null){
    delete study.usedIdx[prev]; delete study.placed[key]; delete study.answers[key];
    renderStudy();
  }
}
function studyAction(act){
  var q = currentQ();
  if(act === "check"){
    if(!q) return;
    study.results = grade(q, study.answers);
    study.checked = true;
    var r = record(q, study.results);
    study.run.answered++; study.run.ok += r.ok; study.run.total += r.total;
    renderStudy();
  }else if(act === "reveal"){
    if(!q) return;
    q.blanks.forEach(function(b){ study.answers[b.key] = b.answers[0]; });
    study.revealed = true; study.results = null;
    renderStudy();
  }else if(act === "next"){
    study.idx++;
    if(study.idx >= study.list.length) flushStudySession();
    loadQuestion(); renderStudy();
  }else if(act === "skip"){
    study.idx++; loadQuestion(); renderStudy();
  }else if(act === "prev"){
    if(study.idx > 0){ study.idx--; loadQuestion(); renderStudy(); }
  }else if(act === "again"){
    buildList(); renderStudy();
  }else if(act === "allscope"){
    setScope({type:"all"});
  }else if(act === "wrongscope"){
    setScope({type:"wrong"});
  }else if(act === "gostats"){
    setView("stats");
  }else if(act === "back"){
    flushStudySession();
    study.picking = true;
    renderStudy();
  }
}
function flushStudySession(){
  if(study.run.total > 0){
    P.sessions.push({
      ts:Date.now(), kind:"study", mode:study.mode,
      scope:scopeLabel(study.scope), n:study.run.answered,
      ok:study.run.ok, total:study.run.total, ms:Date.now() - study.run.start
    });
    if(P.sessions.length > 80) P.sessions = P.sessions.slice(-80);
    save();
    study.run = {answered:0, ok:0, total:0, start:Date.now()};
  }
}
function scopeLabel(s){
  if(s.type === "unit") return UNIT_BY_KEY[s.key].title;
  if(s.type === "wrong") return "錯題複習";
  if(s.type === "fresh") return "未做過的題";
  return "全部題目";
}

/* ============================ 測驗模式 ============================ */
var test = null;
var testCfg = {count:30, minutes:45, scope:"all"};

function renderTestSetup(){
  var counts = [20, 30, 50, 80];
  var mins = [20, 30, 45, 60, 120];
  var scopes = [["all","全部題庫"], ["p1","香港知識"], ["p2","中國知識"], ["wrong","錯題重考"]];
  var last = P.sessions.filter(function(s){ return s.kind === "test"; }).slice(-1)[0];

  elTest.innerHTML =
    '<div class="card lift"><div class="setup">' +
      '<div><div class="lbl">模擬測驗</div>' +
      '<div style="font-family:var(--serif);font-size:21px;font-weight:600;margin-top:6px">計時填充，75% 為合格線</div>' +
      '<div class="hint" style="margin-top:6px">正式考試乙部為 2 小時填充題，佔全卷一半分數，全卷須取得 75% 才合格。這裡以同一標準計分。</div></div>' +
      '<div class="setrow"><span class="lbl">題數</span><div class="seg">' +
        counts.map(function(c){ return '<button class="segbtn" data-count="' + c + '" aria-pressed="' + (testCfg.count === c) + '">' + c + "</button>"; }).join("") +
      "</div></div>" +
      '<div class="setrow"><span class="lbl">時限</span><div class="seg">' +
        mins.map(function(m){ return '<button class="segbtn" data-min="' + m + '" aria-pressed="' + (testCfg.minutes === m) + '">' + m + " 分</button>"; }).join("") +
      "</div></div>" +
      '<div class="setrow"><span class="lbl">範圍</span><div class="seg">' +
        scopes.map(function(s){ return '<button class="segbtn" data-tscope="' + s[0] + '" aria-pressed="' + (testCfg.scope === s[0]) + '">' + s[1] + "</button>"; }).join("") +
      "</div></div>" +
      '<div class="actions"><button class="btn btn-primary" data-tact="start">開始測驗</button>' +
        '<span class="hint">' + testPoolSize() + " 題可供抽取" +
        (last ? "　·　上次得分 " + Math.round(last.ok/last.total*100) + "%" : "") + "</span></div>" +
    "</div></div>";

  elTest.querySelectorAll("[data-count]").forEach(function(b){
    b.addEventListener("click", function(){ testCfg.count = +b.dataset.count; renderTestSetup(); });
  });
  elTest.querySelectorAll("[data-min]").forEach(function(b){
    b.addEventListener("click", function(){ testCfg.minutes = +b.dataset.min; renderTestSetup(); });
  });
  elTest.querySelectorAll("[data-tscope]").forEach(function(b){
    b.addEventListener("click", function(){ testCfg.scope = b.dataset.tscope; renderTestSetup(); });
  });
  elTest.querySelectorAll("[data-tact]").forEach(function(b){
    b.addEventListener("click", function(){ startTest(); });
  });
}
function testPool(){
  if(testCfg.scope === "p1") return Q.filter(function(q){ return q.part === PARTS[0]; });
  if(testCfg.scope === "p2") return Q.filter(function(q){ return q.part === PARTS[1]; });
  if(testCfg.scope === "wrong"){ var w = wrongQueue(); return w.length ? w : Q.slice(); }
  return Q.slice();
}
function testPoolSize(){ return testPool().length; }

function startTest(){
  var pool = shuffle(testPool());
  var list = pool.slice(0, Math.min(testCfg.count, pool.length));
  test = {
    list:list.map(function(q){ return q.id; }),
    idx:0, ans:{}, results:null,
    start:Date.now(), deadline:Date.now() + testCfg.minutes*60000,
    submitted:false, timer:null
  };
  test.timer = setInterval(tick, 1000);
  renderTest();
}
function tick(){
  if(!test || test.submitted) return;
  var left = test.deadline - Date.now();
  var el = document.getElementById("timer");
  if(el){
    el.textContent = fmtTime(Math.max(0, left));
    el.className = "timer" + (left < 60000 ? " crit" : (left < 300000 ? " warn" : ""));
  }
  if(left <= 0) submitTest(true);
}
function fmtTime(ms){
  var s = Math.floor(ms/1000), m = Math.floor(s/60);
  return (m < 10 ? "0" : "") + m + ":" + ((s%60) < 10 ? "0" : "") + (s%60);
}
function renderTest(){
  if(test.submitted) return renderTestResult();
  var q = BY_ID[test.list[test.idx]];
  var answered = test.list.filter(function(id){
    var a = test.ans[id]; if(!a) return false;
    return Object.keys(a).some(function(k){ return String(a[k]).trim(); });
  }).length;

  var bar =
    '<div class="testbar">' +
      '<span class="timer" id="timer">' + fmtTime(Math.max(0, test.deadline - Date.now())) + "</span>" +
      '<div><div class="lbl">進度</div><div style="font-family:var(--mono);font-size:13px">' +
        (test.idx + 1) + " / " + test.list.length + "　已作答 " + answered + "</div></div>" +
      '<div style="flex:1"></div>' +
      '<button class="btn" data-tact="prev"' + (test.idx === 0 ? " disabled" : "") + ">上一題</button>" +
      '<button class="btn" data-tact="next"' + (test.idx + 1 >= test.list.length ? " disabled" : "") + ">下一題</button>" +
      '<button class="btn btn-primary" data-tact="submit">交卷</button>' +
    "</div>";

  var noteBadge = (q.unordered && q.unordered.length) ? '<span class="qtag note">答案無需依次序</span>' : "";
  var a = test.ans[q.id] || {};
  var stem = q.text.split(/(【[A-Z]】)/).map(function(p){
    var m = /^【([A-Z])】$/.exec(p);
    if(!m) return esc(p);
    var k = m[1];
    return '<span class="slotwrap"><span class="slotkey">' + k + "</span>" +
      '<input class="slot slot-fill" data-key="' + k + '" value="' + esc(a[k] || "") +
      '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="填空 ' + k + '"></span>';
  }).join("");

  var nav = test.list.map(function(id, i){
    var aa = test.ans[id];
    var done = aa && Object.keys(aa).some(function(k){ return String(aa[k]).trim(); });
    return '<button class="gnav' + (done ? " done" : "") + (i === test.idx ? " cur" : "") + '" data-jump="' + i + '">' + (i+1) + "</button>";
  }).join("");

  elTest.innerHTML = bar +
    '<div class="card lift">' +
      '<div class="qhead"><span class="qtag unit">' + esc(q.unitTitle) + "</span>" +
      '<span class="qtag">' + q.blanks.length + " 分</span>" + noteBadge + "</div>" +
      '<div class="stem" id="tstem">' + stem + "</div>" +
    "</div>" +
    '<div class="gridnav">' + nav + "</div>";

  bindTest();
}
function bindTest(){
  elTest.querySelectorAll("[data-tact]").forEach(function(b){
    b.addEventListener("click", function(){
      var a = b.dataset.tact;
      if(a === "prev" && test.idx > 0){ test.idx--; renderTest(); }
      else if(a === "next" && test.idx + 1 < test.list.length){ test.idx++; renderTest(); }
      else if(a === "submit"){ armConfirm(b, "確定交卷？", function(){ submitTest(false); }); }
      else if(a === "retry"){ test = null; renderTestSetup(); }
      else if(a === "reviewwrong"){ addTestWrongToQueue(); setScope({type:"wrong"}); setView("study"); }
    });
  });
  elTest.querySelectorAll("[data-jump]").forEach(function(b){
    b.addEventListener("click", function(){ test.idx = +b.dataset.jump; renderTest(); });
  });
  var stem = document.getElementById("tstem");
  if(!stem) return;
  var q = BY_ID[test.list[test.idx]];
  var inputs = stem.querySelectorAll(".slot-fill");
  inputs.forEach(function(inp, i){
    sizeInput(inp);
    inp.addEventListener("input", function(){
      var a = test.ans[q.id] || (test.ans[q.id] = {});
      a[inp.dataset.key] = inp.value;
      sizeInput(inp);
    });
    inp.addEventListener("keydown", function(e){
      if(e.key !== "Enter") return;
      e.preventDefault();
      if(i + 1 < inputs.length) inputs[i+1].focus();
      else if(test.idx + 1 < test.list.length){ test.idx++; renderTest(); }
    });
  });
  if(inputs.length) inputs[0].focus();
}
function submitTest(auto){
  if(test.submitted) return;
  test.submitted = true;
  clearInterval(test.timer);
  var ok = 0, total = 0, byUnit = {};
  test.results = {};
  test.list.forEach(function(id){
    var q = BY_ID[id];
    var res = grade(q, test.ans[id] || {});
    test.results[id] = res;
    var r = record(q, res);
    ok += r.ok; total += r.total;
    var u = byUnit[q.unit] || (byUnit[q.unit] = {ok:0, total:0});
    u.ok += r.ok; u.total += r.total;
  });
  test.score = {ok:ok, total:total, auto:!!auto, byUnit:byUnit, ms:Date.now() - test.start};
  P.sessions.push({
    ts:Date.now(), kind:"test", scope:testCfg.scope, n:test.list.length,
    ok:ok, total:total, ms:test.score.ms, minutes:testCfg.minutes
  });
  if(P.sessions.length > 80) P.sessions = P.sessions.slice(-80);
  save();
  renderTestResult();
}
function addTestWrongToQueue(){ /* 錯題已在 record() 標記，此處只作導航 */ }

function renderTestResult(){
  var s = test.score;
  var acc = s.total ? s.ok/s.total : 0;
  var passed = acc >= 0.75;
  var units = Object.keys(s.byUnit).map(function(k){
    var u = s.byUnit[k];
    return {title:UNIT_BY_KEY[k].title, ok:u.ok, total:u.total, acc:u.ok/u.total};
  }).sort(function(a,b){ return a.acc - b.acc; });

  var reviews = test.list.map(function(id, i){
    var q = BY_ID[id], res = test.results[id], a = test.ans[id] || {};
    var stem = q.text.split(/(【[A-Z]】)/).map(function(p){
      var m = /^【([A-Z])】$/.exec(p);
      if(!m) return esc(p);
      var k = m[1], r = res[k];
      var blank = q.blanks.filter(function(b){ return b.key === k; })[0];

      return '<span class="rs bad">' + (mine ? esc(mine) + " → " : "") + esc(blank.answers.join(" 或 ")) + "</span>";
    }).join("");
    var qok = q.blanks.filter(function(b){ return res[b.key].ok; }).length;
    return '<div class="reviewq"><div class="rnum">' + (i+1) + '</div><div class="rbody">' +
      '<div class="qhead" style="margin-bottom:6px"><span class="qtag unit">' + esc(q.unitTitle) + '</span>' +

  }).join("");

  elTest.innerHTML =
    '<div class="card lift"><div class="stack">' +
      '<div class="lbl">' + (s.auto ? "時間到 · 自動交卷" : "測驗結果") + "</div>" +
      '<div class="scoregrid">' +
        '<div><div class="bigscore ' + (passed ? "pass" : "fail") + '">' + Math.round(acc*100) + '<span style="font-size:24px">%</span></div>' +
        '<div class="tilelabel">' + (passed ? "達到 75% 合格線" : "未達 75% 合格線") + "</div></div>" +
        '<div><div class="tilenum">' + s.ok + " / " + s.total + '</div><div class="tilelabel">答對格數</div></div>' +
        '<div><div class="tilenum">' + fmtTime(s.ms) + '</div><div class="tilelabel">用時</div></div>' +
        '<div><div class="tilenum">' + test.list.length + '</div><div class="tilelabel">題數</div></div>' +
      "</div>" +

        '<button class="btn" data-tact="reviewwrong">練習這次的錯題</button></div>' +
    "</div></div>" +
    '<div class="sechead"><h2>各單元表現</h2><span class="sub">由弱至強</span></div>' +
    '<div class="card"><div class="tablewrap"><table class="stat"><thead><tr><th>單元</th><th style="width:44%">正確率</th><th style="text-align:right">得分</th></tr></thead><tbody>' +
      units.map(function(u){
        return "<tr><td>" + esc(u.title) + '</td><td class="barcell"><div class="bar"><span style="width:' +
          Math.round(u.acc*100) + "%;background:" + tierColor(u.acc) + '"></span></div></td><td class="num">' +
          u.ok + " / " + u.total + "</td></tr>";
      }).join("") +

    '<div class="sechead"><h2>最常做錯的題目</h2><span class="sub">依「錯 − 對」次數排序</span></div>' +

    '<div class="sechead"><h2>進度資料</h2><span class="sub">全部存在這台電腦</span></div>' +
    '<div class="card"><div class="stack">' +
      '<div class="rowwrap" style="align-items:center">' +
        '<button class="btn" id="expbtn">匯出進度</button>' +
        '<button class="btn" id="impbtn">匯入進度</button>' +
        '<button class="btn btn-ghost" id="resetbtn">清除所有紀錄</button>' +
        '<input type="file" id="impfile" accept="application/json,.json" hidden>' +
      "</div>" +
      '<div class="hint" id="iostatus">' +
        (storageOK()
          ? "紀錄自動存在這個瀏覽器，關掉再開仍在。換電腦或換瀏覽器時，用匯出／匯入搬移。"
          : "這個瀏覽器不允許本機儲存，進度只保留到關閉分頁為止——請改用 Chrome 開啟，或先匯出備份。") +
      "</div>" +
    "</div></div>";

  elStats.querySelectorAll("[data-practice]").forEach(function(b){
    b.addEventListener("click", function(){
      setScope({type:"unit", key:b.dataset.practice});
      setView("study");
    });
  });
  var eb = document.getElementById("expbtn");
  if(eb) eb.addEventListener("click", exportProgress);
  var ib = document.getElementById("impbtn"), ifile = document.getElementById("impfile");
  if(ib && ifile){
    ib.addEventListener("click", function(){ ifile.click(); });
    ifile.addEventListener("change", function(){
      if(!ifile.files || !ifile.files[0]) return;
      importProgress(ifile.files[0], function(err){
        if(err){ document.getElementById("iostatus").textContent = err; return; }
        renderStats();
        document.getElementById("iostatus").textContent = "進度已匯入。";
      });
      ifile.value = "";
    });
  }
  var rb = document.getElementById("resetbtn");
  if(rb) rb.addEventListener("click", function(){
    armConfirm(rb, "再按一次確認清除", function(){
      P = {v:1, updatedAt:Date.now(), blanks:{}, questions:{}, sessions:[]};
      save(); renderStats();
    });
  });
}
function tile(num, label, foot, color){
  return '<div class="tile"><div class="tilenum"' + (color ? ' style="color:' + color + '"' : "") + ">" + esc(num) + "</div>" +
    '<div class="tilelabel">' + esc(label) + '</div><div class="tilefoot">' + esc(foot) + "</div></div>";
}
function testChart(tests){
  var W = 660, H = 210, padL = 38, padR = 14, padT = 16, padB = 34;
  var data = tests.slice(-12);
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var y = function(v){ return padT + innerH - (v/100)*innerH; };
  var g = "";
  [0, 25, 50, 100].forEach(function(v){
    var yy = y(v);
    g += '<line class="g-line" x1="' + padL + '" y1="' + yy + '" x2="' + (W-padR) + '" y2="' + yy + '"/>';
    g += '<text class="g-lbl" x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end">' + v + '</text>';
  });
  g += '<line class="g-pass" x1="' + padL + '" y1="' + y(75) + '" x2="' + (W-padR) + '" y2="' + y(75) + '"/>';
  g += '<text class="g-lbl" x="' + (padL-8) + '" y="' + (y(75)+4) + '" text-anchor="end">75</text>';
  g += '<text class="g-note" x="' + (W-padR) + '" y="' + (y(75)-7) + '" text-anchor="end">合格線 75%</text>';

  if(!data.length){
    g += '<text class="g-empty" x="' + (padL + innerW/2) + '" y="' + (padT + innerH/2) + '" text-anchor="middle">尚未有測驗紀錄，做一次模擬測驗就會出現在這裡</text>';
  }else{
    var slot = innerW / data.length;
    var bw = Math.min(46, slot * 0.56);
    data.forEach(function(s, i){
      var v = Math.round(s.ok/s.total*100);
      var cx = padL + slot*(i + 0.5);
      var top = y(v);
      var cls = v >= 75 ? "b-ok" : (v >= 50 ? "b-warn" : "b-bad");
      g += '<rect class="' + cls + '" x="' + (cx - bw/2) + '" y="' + top + '" width="' + bw +
        '" height="' + Math.max(1, y(0) - top) + '" rx="3" opacity="0.88"/>';
      g += '<text class="g-val" x="' + cx + '" y="' + (top - 6) + '" text-anchor="middle">' + v + '</text>';
      var d = new Date(s.ts);
      g += '<text class="g-lbl" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' +
        (d.getMonth()+1) + '/' + d.getDate() + '</text>';
    });
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="測驗成績趨勢">' + g + '</svg>';
}

window.addEventListener("beforeunload", flushStudySession);
