<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>乙部通關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --paper:#F6F2F0;
  --surface:#FFFFFF;
  --surface-2:#EEE7E5;
  --line:#DFD6D3;
  --line-2:#CFC3BF;
  --ink:#211B20;
  --ink-2:#6B5F67;
  --ink-3:#95878E;
  --accent:#A82248;
  --accent-2:#871B3A;
  --accent-soft:#F6E0E7;
  --on-accent:#FFFFFF;
  --harbour:#155E68;
  --harbour-soft:#DDECEE;
  --ok:#1C7A55;
  --ok-soft:#DCEFE5;
  --bad:#B33427;
  --bad-soft:#F8DFDB;
  --warn:#96690F;
  --warn-soft:#F6EAD2;
  --shadow:0 1px 2px rgba(33,27,32,.05), 0 10px 28px -16px rgba(33,27,32,.30);
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK","Hiragino Sans TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17131A;
    --surface:#1F1A22;
    --surface-2:#292330;
    --line:#362F3E;
    --line-2:#463D50;
    --ink:#F1EAEE;
    --ink-2:#B4A7B4;
    --ink-3:#8B7E8B;
    --accent:#F07C9C;
    --accent-2:#F9A6BC;
    --accent-soft:#3B2029;
  --on-accent:#241219;
    --on-accent:#241219;
    --harbour:#5FBFC9;
    --harbour-soft:#123136;
    --ok:#5FC79B;
    --ok-soft:#123425;
    --bad:#F08A7C;
    --bad-soft:#3A1D19;
    --warn:#DFAB47;
    --warn-soft:#332711;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#17131A;
  --surface:#1F1A22;
  --surface-2:#292330;
  --line:#362F3E;
  --line-2:#463D50;
  --ink:#F1EAEE;
  --ink-2:#B4A7B4;
  --ink-3:#8B7E8B;
  --accent:#F07C9C;
  --accent-2:#F9A6BC;
  --accent-soft:#3B2029;
  --harbour:#5FBFC9;
  --harbour-soft:#123136;
  --ok:#5FC79B;
  --ok-soft:#123425;
  --bad:#F08A7C;
  --bad-soft:#3A1D19;
  --warn:#DFAB47;
  --warn-soft:#332711;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:10px 22px;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.brand-mark{
  width:30px; height:30px; flex:none; border-radius:50%;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center;
  font-family:var(--serif); font-weight:700; font-size:15px; line-height:1;
  padding-bottom:1px;
}
.brand-name{font-family:var(--serif); font-weight:700; font-size:17px; letter-spacing:.03em; line-height:1.2}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); line-height:1.4;
}
.tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:9px}
.tab{
  border:0; background:transparent; color:var(--ink-2);
  padding:6px 15px; border-radius:7px; cursor:pointer;
  font-family:var(--serif); font-weight:600; font-size:14px; letter-spacing:.05em;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.10)}
.sync{
  display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-3);
}
.dot{width:6px; height:6px; border-radius:50%; background:var(--ink-3)}
.dot.on{background:var(--ok)}

/* ---------- shell ---------- */
.shell{padding:26px 22px 40px; max-width:940px; margin:0 auto}
.shell.stats{max-width:1120px}

/* ---------- 主題卡片 ---------- */
.picker{display:flex; flex-direction:column; gap:12px}
.phead{margin-bottom:6px}
.phead h1{font-family:var(--serif); font-size:23px; font-weight:700; margin:0 0 5px; letter-spacing:.02em}
.phead p{margin:0; color:var(--ink-2); font-size:14px}
.psec{display:flex; align-items:center; gap:12px; margin:22px 0 2px}
.psec .line{flex:1; height:1px; background:var(--line)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:11px}
.pgrid.quick{grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.pcard{
  display:flex; flex-direction:column; gap:7px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px 15px; color:var(--ink);
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.pcard:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow)}
.pcard .peye{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.pcard .pname{font-family:var(--serif); font-size:16.5px; font-weight:600; line-height:1.4}
.pcard .pmeta{margin-top:auto; display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.pcard.flag .pnum{color:var(--bad)}
.pcard .pnum{font-family:var(--mono); font-size:22px; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums}
.ubar{height:3px; border-radius:2px; background:var(--surface-2); overflow:hidden; margin-top:2px}
.ubar span{display:block; height:100%; border-radius:2px; transition:width .35s ease}
.backbtn{padding-left:10px; padding-right:14px}
.scopestat{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--ink-3);
  margin:-6px 2px 16px; font-variant-numeric:tabular-nums;
}
.scopestat .mini{display:inline-block; width:54px; height:3px; border-radius:2px; background:var(--surface-2); overflow:hidden}
.scopestat .mini span{display:block; height:100%; border-radius:2px}
.scount{font-family:var(--mono); font-size:11px; color:var(--ink-3)}

/* ---------- generic ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 24px}
.card.lift{box-shadow:var(--shadow)}
.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:8px 16px; border-radius:9px; cursor:pointer; font-size:14px; line-height:1.4;
  transition:background .15s ease, border-color .15s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45; cursor:default}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2)}
.btn-ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
.seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px}
.segbtn{border:0; background:transparent; color:var(--ink-2); padding:5px 13px; border-radius:7px; cursor:pointer; font-size:13.5px}
.segbtn[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.10)}
.hint{font-size:12.5px; color:var(--ink-3); line-height:1.6}
.lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- study ---------- */
.toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.toolbar .spacer{flex:1}
.progline{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.ptrack{width:120px; height:3px; background:var(--surface-2); border-radius:2px; overflow:hidden}
.pfill{height:100%; background:var(--accent); transition:width .3s ease}

.qhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.qtag{
  font-family:var(--mono); font-size:11px; letter-spacing:.05em;
  padding:2px 8px; border-radius:5px; background:var(--surface-2); color:var(--ink-2);
}
.qtag.unit{background:var(--harbour-soft); color:var(--harbour)}
.qtag.note{background:var(--warn-soft); color:var(--warn)}
.qtag.mark{background:transparent; color:var(--ink-3); padding-left:0}

.stem{font-size:17.5px; line-height:2.5; letter-spacing:.01em; word-break:break-word}
.slotwrap{display:inline-flex; align-items:flex-start; gap:2px; margin:0 3px; vertical-align:baseline}
.slotkey{font-family:var(--mono); font-size:10px; color:var(--accent); line-height:1.2; padding-top:2px}
.slot{
  display:inline-block; min-width:6.6em; padding:1px 8px; text-align:center;
  font-size:16px; line-height:1.55; color:var(--ink);
  background:var(--surface-2); border:1px solid transparent;
  border-bottom:2px solid var(--line-2); border-radius:6px 6px 3px 3px;
}
.slot-fill{width:6.6em; transition:width .12s ease}
.slot-fill::placeholder{color:var(--ink-3)}
.slot-drop{cursor:pointer; min-height:1.9em}
.slot-drop.has{background:var(--accent-soft); border-bottom-color:var(--accent); color:var(--ink); font-weight:600}
.slot-drop.over{background:var(--harbour-soft); border-bottom-color:var(--harbour)}
.slot.is-ok{background:var(--ok-soft); border-bottom-color:var(--ok); color:var(--ok); font-weight:600}
.slot.is-bad{background:var(--bad-soft); border-bottom-color:var(--bad); color:var(--bad); font-weight:600}

.tray{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; padding-top:18px; border-top:1px dashed var(--line)}
.chip{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:6px 14px; border-radius:8px; cursor:grab; font-size:15px; line-height:1.5;
  box-shadow:0 1px 0 var(--line);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.sel{background:var(--accent); border-color:var(--accent); color:var(--on-accent); box-shadow:none}
.chip.used{opacity:.28; pointer-events:none; box-shadow:none}
.traylbl{width:100%; margin-bottom:2px}

.actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:22px}
.feedback{margin-top:20px; border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:7px}
.fbrow{display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:baseline; font-size:14.5px}
.fbkey{font-family:var(--mono); font-size:11.5px; color:var(--ink-3)}
.fbmine{color:var(--bad); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--bad) 45%, transparent)}
.fbans{color:var(--ok); font-weight:600}
.fbsep{color:var(--ink-3); margin:0 6px}
.fbalt{color:var(--ink-3); font-size:12.5px}
.verdict{display:flex; align-items:center; gap:9px; font-size:15px; margin-bottom:4px}
.verdict .badge{font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:2px 8px; border-radius:5px}
.badge.good{background:var(--ok-soft); color:var(--ok)}
.badge.miss{background:var(--bad-soft); color:var(--bad)}

.empty{display:flex; flex-direction:column; gap:12px; align-items:flex-start; padding:26px 4px; color:var(--ink-2)}

/* ---------- summary ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 17px}
.tilenum{font-family:var(--mono); font-size:27px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.tilelabel{font-size:12.5px; color:var(--ink-2); margin-top:3px}
.tilefoot{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:6px}

/* ---------- test ---------- */
.testbar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:12px 18px; margin-bottom:18px; box-shadow:var(--shadow);
}
.timer{font-family:var(--mono); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.timer.warn{color:var(--warn)} .timer.crit{color:var(--bad)}
.gridnav{display:flex; flex-wrap:wrap; gap:5px; margin-top:18px}
.gnav{
  width:32px; height:30px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-3);
  font-family:var(--mono); font-size:11.5px; padding:0;
}
.gnav.done{background:var(--harbour-soft); border-color:var(--harbour-soft); color:var(--harbour)}
.gnav.cur{border-color:var(--accent); color:var(--accent); font-weight:600}
.gnav.wrong{background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad)}
.gnav.right{background:var(--ok-soft); border-color:var(--ok-soft); color:var(--ok)}

.setup{display:flex; flex-direction:column; gap:20px}
.setrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.setrow .lbl{width:64px; flex:none}
.scoregrid{display:flex; align-items:flex-end; gap:26px; flex-wrap:wrap}
.bigscore{font-family:var(--mono); font-size:60px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.reviewlist{display:flex; flex-direction:column; gap:0}
.reviewq{border-top:1px solid var(--line); padding:16px 0; display:flex; gap:14px}
.rnum{font-family:var(--mono); font-size:12px; color:var(--ink-3); flex:none; width:30px; padding-top:3px}
.rbody{flex:1; min-width:0}
.rstem{font-size:15px; line-height:2.1; color:var(--ink-2)}
.rstem .rs{padding:1px 7px; border-radius:5px; font-weight:600}
.rs.ok{background:var(--ok-soft); color:var(--ok)}
.rs.bad{background:var(--bad-soft); color:var(--bad)}

/* ---------- stats ---------- */
.tablewrap{overflow-x:auto; margin-top:8px}
table.stat{width:100%; border-collapse:collapse; font-size:14px; min-width:520px}
table.stat th{
  text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; padding:0 10px 8px 0; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.stat td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:middle}
table.stat td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2); text-align:right; white-space:nowrap}
.barcell{min-width:140px}
.bar{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.bar span{display:block; height:100%; border-radius:3px}
.wrongitem{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.wrongitem .wq{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chartbox{margin-top:6px}
.chart{display:block; width:100%; height:auto; max-width:100%}
.chart .g-line{stroke:var(--line); stroke-width:1; fill:none}
.chart .g-pass{stroke:var(--accent); stroke-width:1.5; stroke-dasharray:4 4; fill:none}
.chart text{font-family:var(--mono); font-variant-numeric:tabular-nums}
.chart .g-lbl{fill:var(--ink-3); font-size:10px}
.chart .g-val{fill:var(--ink-2); font-size:11px}
.chart .g-note{fill:var(--accent); font-size:10px}
.chart .g-empty{fill:var(--ink-3); font-size:13px; font-family:var(--sans)}
.chart .b-ok{fill:var(--ok)} .chart .b-warn{fill:var(--warn)} .chart .b-bad{fill:var(--bad)}
.sechead{display:flex; align-items:baseline; gap:12px; margin:34px 0 10px}
.sechead h2{font-family:var(--serif); font-size:19px; font-weight:600; margin:0; letter-spacing:.02em}
.sechead .sub{font-size:12.5px; color:var(--ink-3)}

.stack{display:flex; flex-direction:column; gap:14px}
.rowwrap{display:flex; gap:14px; flex-wrap:wrap}

.pagefoot{
  max-width:940px; margin:0 auto; padding:20px 22px 44px;
  border-top:1px solid var(--line);
  font-size:12px; line-height:1.95; color:var(--ink-3);
}
.pagefoot strong{font-weight:600; color:var(--ink-2)}

@media (max-width:980px){
  .shell{padding:16px 14px 28px}
  .topbar{padding:9px 14px; gap:10px}
  .brand{gap:9px}
  .brand-mark{width:27px; height:27px; font-size:14px}
  .brand-name{font-size:16px}
  .eyebrow{font-size:9.5px; letter-spacing:.08em}
  .tab{padding:5px 13px; font-size:13.5px}
  .sync{font-size:10px}
  .toolbar{gap:8px; margin-bottom:12px}
  .segbtn{padding:5px 11px; font-size:13px}
  .backbtn{padding:6px 11px 6px 8px; font-size:13.5px}
  .progline{font-size:11.5px; gap:8px}
  .ptrack{width:76px}
  .phead h1{font-size:20px}
  .stem{font-size:16px; line-height:2.15}
  .slot{min-width:4.6em; font-size:15.5px; padding:1px 6px}
  .slot-fill{width:4.6em}
  .slotwrap{margin:0 2px}
  .chip{padding:6px 12px; font-size:14.5px}
  .card{padding:17px 15px}
  .testbar{padding:11px 14px; gap:12px}
  .timer{font-size:21px}
  .bigscore{font-size:46px}
  .scopestat{font-size:11px; gap:7px}
  .actions{gap:8px}
  .actions .spacer{display:none}
  .btn{padding:8px 13px}
}
@media (max-width:560px){
  .pgrid,.pgrid.quick{grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:9px}
  .pcard{padding:12px 13px 13px}
  .pcard .pname{font-size:15.5px}
}
@media (max-width:420px){
  .sync{display:none}
  .tabs{flex:1}
  .tab{flex:1; text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">乙</div>
    <div>
      <div class="brand-name">乙部通關</div>
      <div class="eyebrow">卷一乙部 · 香港及中國知識 · 324 題</div>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="模式">
    <button class="tab" role="tab" id="tab-study" aria-selected="true" data-view="study">學習</button>
    <button class="tab" role="tab" id="tab-test" aria-selected="false" data-view="test">測驗</button>
    <button class="tab" role="tab" id="tab-stats" aria-selected="false" data-view="stats">統計</button>
  </div>
  <div class="sync" id="sync"><span class="dot" id="syncdot"></span><span id="synctext">本機儲存</span></div>
</header>

<main class="shell" id="shell">
  <section class="work">
    <div id="view-study"></div>
    <div id="view-test" hidden></div>
    <div id="view-stats" hidden></div>
  </section>
</main>

<footer class="pagefoot">
  題庫整理自旅遊業監管局公開的《導遊領牌考試——香港及中國知識考試範圍》（2026 年 2 月版），
  適用於 2026 年 3 月起舉行的考試。本頁只供溫習用途，
