,"answers":["聖誕","25"]},{"key":"D","answers":["三年八個月"]}],"unordered":[]},{"id":"單元二-8","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":8,"text":"和平紀念碑位於【A】，在1923年興建，用以紀念第一及第二次世界大戰中在港的【B】。該紀念碑於2013年被列為【C】。","blanks":[{"key":"A","answers":["中環"]},{"key":"B","answers":["殉難者"]},{"key":"C","answers":["法定古蹟"]}],"unordered":[]},{"id":"單元二-9","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":9,"text":"1965年，【A】正式被定為香港市花，該花首先在1880年左右於香港島薄扶林【B】灣被一名來自【C】的傳教會【D】發現。","blanks":[{"key":"A","answers":["洋紫荊"]},{"key":"B","answers":["鋼綫"]},{"key":"C","answers":["巴黎"]},{"key":"D","answers":["神父"]}],"unordered":[]},{"id":"單元二-10","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":10,"text":"香港開埠後，公用事業相繼開辦，【A】年成立了香港中華煤氣公司。","blanks":[{"key":"A","answers":["1862"]}],"unordered":[]},{"id":"單元二-11","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":11,"text":"行走港島中環【A】大廈至山頂之間的纜車服務於【B】年通車。此纜車是全【C】最早的纜車索道系統。","blanks":[{"key":"A","answers":["聖約翰"]},{"key":"B","answers":["1888"]},{"key":"C","answers":["亞洲"]}],"unordered":[]},{"id":"單元二-12","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":12,"text":"在香港島【A】岸行走的電車於【B】年投入服務，現時來往香港島東邊的【C】至西邊的【D】。","blanks":[{"key":"A","answers":["北"]},{"key":"B","answers":["1904"]},{"key":"C","answers":["筲箕灣"]},{"key":"D","answers":["堅尼地城"]}],"unordered":[]},{"id":"單元二-13","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":13,"text":"香港在開埠前沒有街道名稱，只有「里」和「坊」。所謂「里」是【A】朝的區域行政單位，與「【B】」相似。「坊」則是指市鎮内外小【C】或狹窄的【D】。","blanks":[{"key":"A","answers":["清"]},{"key":"B","answers":["村"]},{"key":"C","answers":["空地"]},{"key":"D","answers":["通路"]}],"unordered":[]},{"id":"單元二-14","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":14,"text":"香港沿海一帶，發現了幾處古代石刻，風格十分相近，紋飾基本呈【A】形，與【B】青銅器紋飾相近，隱約可見【C】或【D】圖案。","blanks":[{"key":"A","answers":["幾何"]},{"key":"B","answers":["商周"]},{"key":"C","answers":["人物"]},{"key":"D","answers":["鳥獸"]}],"unordered":[["C","D"]]},{"id":"單元二-15","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":15,"text":"【A】年石硤尾發生【B】區大火，約【C】萬多名居民一夜間喪失家園。其後，香港房屋委員會於【D】年成立。","blanks":[{"key":"A","answers":["1953"]},{"key":"B","answers":["木屋"]},{"key":"C","answers":["五"]},{"key":"D","answers":["1973"]}],"unordered":[]},{"id":"單元二-16","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":16,"text":"由香港開埠至19世紀末，香港街道大多以歷任【A】、與英國有關的重要人士、【B】或英商巨賈的名稱來命名，名稱都是英譯中，例如砵甸乍街。","blanks":[{"key":"A","answers":["總督"]},{"key":"B","answers":["高官"]}],"unordered":[]},{"id":"單元二-17","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":17,"text":"舊最高法院於1912年落成啟用，為本港最具代表性的新古典風格建築之一，曾為【A】大樓，現為【B】。","blanks":[{"key":"A","answers":["立法會"]},{"key":"B","answers":["終審法院"]}],"unordered":[]},{"id":"單元二-18","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":18,"text":"梅夫人婦女會為一所女子【A】及宿舍，於1916年興建，位於【B】總站旁。建築物中央建有一個精緻的門廊。建築物主樓外部於1993年列為法定古蹟。","blanks":[{"key":"A","answers":["會所"]},{"key":"B","answers":["山頂纜車"]}],"unordered":[]},{"id":"單元二-19","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":19,"text":"舊牛奶公司倉庫於1892年落成，1896至1982年間為牛奶公司總部，現時為【A】及【B】會址。","blanks":[{"key":"A","answers":["藝穗會"]},{"key":"B","answers":["外國記者協會"]}],"unordered":[["A","B"]]},{"id":"單元二-20","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":20,"text":"中西區文物徑之西區及山頂線包括【A】項歷史建築及遺址，西區線涵蓋三個地區，包括西營盤、【B】和堅尼地城。早期西區居民以【C】為主，1850年以後，國内大批【D】湧入香港，並聚居該區。","blanks":[{"key":"A","answers":["25"]},{"key":"B","answers":["石塘咀"]},{"key":"C","answers":["英軍"]},{"key":"D","answers":["難民"]}],"unordered":[]},{"id":"單元二-21","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":21,"text":"中西區文物徑之上環線位於香港島北岸，是傳統華人【A】地區，涵蓋【B】項歷史建築及遺址。","blanks":[{"key":"A","answers":["商住"]},{"key":"B","answers":["35"]}],"unordered":[]},{"id":"單元二-22","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":22,"text":"文武廟始建於1847年，奉祀【A】君及【B】君，是香港開埠初期中上環一帶華商及居民的【C】中心。","blanks":[{"key":"A","answers":["文昌帝"]},{"key":"B","answers":["關聖帝"]},{"key":"C","answers":["祭祀"]}],"unordered":[["A","B"]]},{"id":"單元二-23","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":23,"text":"香港大學本部大樓是香港大學内歷史最悠久的建築物，於1910至12年間興建，設有兩個庭院，採用後【A】時期的建築風格，用【B】及【C】建造，正面以四座塔樓連接，中央為一座【D】。","blanks":[{"key":"A","answers":["文藝復興"]},{"key":"B","answers":["紅磚"]},{"key":"C","answers":["花崗石"]},{"key":"D","answers":["鐘樓"]}],"unordered":[["B","C"]]},{"id":"單元二-24","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":24,"text":"昔日香港曾經是兩位南宋皇帝【A】之地。「【B】」這個地名，相傳由兩位皇帝所命名，故事充滿神話色彩。","blanks":[{"key":"A","answers":["避難"]},{"key":"B","answers":["九龍"]}],"unordered":[]},{"id":"單元二-25","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":25,"text":"聚星樓是香港現存唯一的【A】，坐落於【B】文物徑的上璋圈北面。據屏山鄧氏族譜所載，聚星樓由鄧族第七世鄧祖彥通所興建，已有超過【C】百年的歷史。","blanks":[{"key":"A","answers":["古塔"]},{"key":"B","answers":["屏山"]},{"key":"C","answers":["六"]}],"unordered":[]},{"id":"單元二-26","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":26,"text":"現位於【A】的美利樓是古歐陸【B】式建築物，建於1844 年，原址在現今【C】大廈的位置，1982年拆卸，【D】年在現址重建。","blanks":[{"key":"A","answers":["赤柱"]},{"key":"B","answers":["維多利亞"]},{"key":"C","answers":["中銀"]},{"key":"D","answers":["1998"]}],"unordered":[]},{"id":"單元二-27","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":27,"text":"「回教清真禮拜堂」為香港【A】座清真禮拜堂，俗稱「【B】」。禮拜堂於1915 年重建，並保留原有的【C】。該堂外形呈長方形，正門為【D】形，四周設有【E】色彩的拱窗。","blanks":[{"key":"A","answers":["首"]},{"key":"B","answers":["摩羅廟"]},{"key":"C","answers":["尖塔"]},{"key":"D","answers":["拱"]},{"key":"E","answers":["阿拉伯"]}],"unordered":[]},{"id":"單元二-28","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":28,"text":"李鄭屋漢墓於【A】年被發現，經考證為【B】期間的古物。","blanks":[{"key":"A","answers":["1955"]},{"key":"B","answers":["東漢"]}],"unordered":[]},{"id":"單元二-29","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":29,"text":"現時的孫中山史蹟徑，以「古今、【A】」為主調，由16項歷史遺跡組成，包括孫中山接受教育的學校及【B】的地方、與友人【C】的場所、以及孫中山與其同志在香港展開【D】活動的地點。","blanks":[{"key":"A","answers":["藝術"]},{"key":"B","answers":["居住"]},{"key":"C","answers":["談論國是"]},{"key":"D","answers":["革命"]}],"unordered":[]},{"id":"單元二-30","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":30,"text":"新界五大族群包括：【A】氏、【B】氏、【C】氏、【D】氏、【E】氏。","blanks":[{"key":"A","answers":["鄧"]},{"key":"B","answers":["文"]},{"key":"C","answers":["廖"]},{"key":"D","answers":["侯"]},{"key":"E","answers":["彭"]}],"unordered":[["A","B","C","D","E"]]},{"id":"單元二-31","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":31,"text":"錦田【A】是鄧氏興建的一條最大規模的古老圍村，始建於【B】代。鄧氏不少旁支亦從錦田一帶遷移到新界各地立業，例如元朗屏山、粉嶺【C】及【D】等地。","blanks":[{"key":"A","answers":["吉慶圍"]},{"key":"B","answers":["明"]},{"key":"C","answers":["龍躍頭"]},{"key":"D","answers":["大埔頭"]}],"unordered":[]},{"id":"單元二-32","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":32,"text":"新界侯氏家族初期在【A】興建村落定居，後來才到其他地方建立村莊。","blanks":[{"key":"A","answers":["河上鄉"]}],"unordered":[]},{"id":"單元二-33","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":33,"text":"新界彭氏家族由廣東【A】遷入新界，一直定居在【B】至今。","blanks":[{"key":"A","answers":["東莞"]},{"key":"B","answers":["粉嶺"]}],"unordered":[]},{"id":"單元二-34","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":34,"text":"新界廖氏家族初落戶於【A】，後來在【B】一帶定居後，便再沒有遷移了。","blanks":[{"key":"A","answers":["屯門"]},{"key":"B","answers":["上水"]}],"unordered":[]},{"id":"單元二-35","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":35,"text":"文氏於【A】末【B】初移居入新界，後來以【C】為族人主要的聚居地。","blanks":[{"key":"A","answers":["元"]},{"key":"B","answers":["明"]},{"key":"C","answers":["新田"]}],"unordered":[]},{"id":"單元二-36","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":36,"text":"香港富有新界圍村宗族特色的文物徑共有兩條，分別為位於元朗的【A】文物徑和粉嶺的【B】文物徑。","blanks":[{"key":"A","answers":["屏山"]},{"key":"B","answers":["龍躍頭"]}],"unordered":[]},{"id":"單元二-37","part":"第一部分：香港知識","unit":"單元二","unitTitle":"香港歷史及相關景點","num":37,"text":"「香港禮賓府」（前稱【A】），為香港特別行政區行政長官的【B】及【C】，【D】年列為法定古蹟。","blanks":[{"key":"A","answers":["總督府"]},{"key":"B","answers":["辦公室"]},{"key":"C","answers":["官邸"]},{"key":"D","answers":["1995"]}],"unordered":[["B","C"]]},{"id":"單元三-1","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":1,"text":"中英兩國在【A】年12月19日簽訂《【B】》，當中載明中華人民共和國對香港的基本方針政策。","blanks":[{"key":"A","answers":["1984"]},{"key":"B","answers":["中英聯合聲明"]}],"unordered":[]},{"id":"單元三-2","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":2,"text":"香港在【A】正式成為中國的特別行政區。根據《基本法》，香港原有的【B】主義制度和【C】方式，最少保持【D】年不變。","blanks":[{"key":"A","answers":["1997年7月1日"]},{"key":"B","answers":["資本"]},{"key":"C","answers":["生活"]},{"key":"D","answers":["50"]}],"unordered":[]},{"id":"單元三-3","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":3,"text":"香港行政長官每屆任期為【A】年，並可連任【B】次。","blanks":[{"key":"A","answers":["五"]},{"key":"B","answers":["一"]}],"unordered":[]},{"id":"單元三-4","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":4,"text":"【A】是協助行政長官決策的機構，每周舉行【B】次會議，由【C】主持。","blanks":[{"key":"A","answers":["行政會議"]},{"key":"B","answers":["一"]},{"key":"C","answers":["行政長官","特首"]}],"unordered":[]},{"id":"單元三-5","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":5,"text":"由2022年7月1日起，香港的行政體系中，共有【A】名司長和【B】名局長。他們的任期為【C】年，不會超逾【D】的任期。他們同時獲委任為【E】成員。","blanks":[{"key":"A","answers":["3"]},{"key":"B","answers":["15"]},{"key":"C","answers":["五"]},{"key":"D","answers":["行政長官"]},{"key":"E","answers":["行政會議"]}],"unordered":[]},{"id":"單元三-6","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":6,"text":"根據《【A】》，香港特區按照「一國兩制」的原則，實行【B】，享有行政管理權、【C】、獨立的【D】和終審權。","blanks":[{"key":"A","answers":["基本法"]},{"key":"B","answers":["高度自治"]},{"key":"C","answers":["立法權"]},{"key":"D","answers":["司法權"]}],"unordered":[]},{"id":"單元三-7","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":7,"text":"香港特別行政區的法律制度以【A】為基礎，與内地的法制有別。《【B】》和《基本法》均保證，中國恢復對香港行使主權後，原有的法律制度得以延續。","blanks":[{"key":"A","answers":["普通法"]},{"key":"B","answers":["中英聯合聲明"]}],"unordered":[]},{"id":"單元三-8","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":8,"text":"【A】於1997年7月1日成立，為香港最高的上訴法院，在聆訊案件時會由【B】位法官主理。","blanks":[{"key":"A","answers":["終審法院"]},{"key":"B","answers":["五"]}],"unordered":[]},{"id":"單元三-9","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":9,"text":"宗教自由是香港居民享有的基本權利之一，受《【A】》和有關法例保障。很多主要宗教團體在香港除了弘揚教義之外，還興辦【B】和提供【C】福利設施。","blanks":[{"key":"A","answers":["基本法"]},{"key":"B","answers":["學校"]},{"key":"C","answers":["衞生"]}],"unordered":[]},{"id":"單元三-10","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":10,"text":"根據《基本法》，香港特別行政區立法會由【A】產生。立法會的產生辦法根據香港特别行政區的實際情況和循序漸進的原則而規定，最終目標是達致全部議員由【B】產生。","blanks":[{"key":"A","answers":["選舉"]},{"key":"B","answers":["普選"]}],"unordered":[]},{"id":"單元三-11","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":11,"text":"按照《基本法》，香港特別行政區可在【A】、貿易、【B】、航運、通訊、【C】、文化、體育等領域以「【D】」的名義，單獨地與世界各國、各地區及有關國際組織保持和發展關係，簽訂和履行有關協議。","blanks":[{"key":"A","answers":["經濟"]},{"key":"B","answers":["金融"]},{"key":"C","answers":["旅遊"]},{"key":"D","answers":["中國香港"]}],"unordered":[["A","B","C"]]},{"id":"單元三-12","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":12,"text":"【A】計劃設有高齡津貼、傷殘津貼及長者生活津貼。高齡津貼及傷殘津貼的目的分別是為年齡在【B】歲或以上，或嚴重殘疾的香港居民，每月提供【C】津貼，以應付因年老或嚴重殘疾而引致的特別需要，不設經濟狀況審查。","blanks":[{"key":"A","answers":["公共福利金"]},{"key":"B","answers":["70"]},{"key":"C","answers":["現金"]}],"unordered":[]},{"id":"單元三-13","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":13,"text":"為全面提升教育質素，香港政府提供【A】年免費教育。本地的中學及小學可分為由政府全額資助的【B】學校和資助學校、由政府提供津貼並收取學費營運的【C】學校，以及以自負盈虧模式運作的私立學校和【D】學校。","blanks":[{"key":"A","answers":["12"]},{"key":"B","answers":["官立"]},{"key":"C","answers":["直資"]},{"key":"D","answers":["國際"]}],"unordered":[]},{"id":"單元三-14","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":14,"text":"香港提供優質、多元、靈活及多階進出的升學途徑予學生接受專上教育。根據教育局網頁，香港有【A】所可頒授本地學位的專上教育院校，其中【B】所獲公帑資助，其餘則【C】營運。","blanks":[{"key":"A","answers":["22"]},{"key":"B","answers":["9"]},{"key":"C","answers":["自資"]}],"unordered":[]},{"id":"單元三-15","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":15,"text":"香港政府推行的幼稚園教育計劃，直接向參加計劃的本地【A】幼稚園提供資助，為所有【B】歲至六歲的合資格兒童提供【C】制優質幼稚園教育服務。","blanks":[{"key":"A","answers":["非牟利"]},{"key":"B","answers":["三"]},{"key":"C","answers":["半日"]}],"unordered":[]},{"id":"單元三-16","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":16,"text":"入境事務處負責的工作主要分為兩大類：第一類是對經海、陸、空三路【A】的人士施行管制；第二類是為本港居民辦理各類證件，包括根據《基本法》而提出的【B】聲稱、簽發【C】證件和身份證，以及辦理生死和【D】登記手續。","blanks":[{"key":"A","answers":["出入境"]},{"key":"B","answers":["居留權"]},{"key":"C","answers":["旅行"]},{"key":"D","answers":["婚姻"]}],"unordered":[]},{"id":"單元三-17","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":17,"text":"醫院管理局是一個獨立機構，負責管理全港所有【A】及轄下的【B】診療所和【C】，為病人提供醫療和康復服務。","blanks":[{"key":"A","answers":["公營醫院"]},{"key":"B","answers":["專科"]},{"key":"C","answers":["外展服務"]}],"unordered":[]},{"id":"單元三-18","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":18,"text":"香港兒童醫院屬於【A】醫院，提供全港性的兒科服務，不設【B】或【C】門診，所有病人均須經【D】或私家醫生轉介。","blanks":[{"key":"A","answers":["專科"]},{"key":"B","answers":["急症室"]},{"key":"C","answers":["普通科"]},{"key":"D","answers":["公立醫院"]}],"unordered":[]},{"id":"單元三-19","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":19,"text":"香港法例第549章《中醫藥條例》全面實施後，香港的中醫可分為三類。第一類是已完成認可的中醫執業本科訓練學位課程，並通過中醫執業資格試的【A】中醫；第二類為只可在指定的教育或科研機構進行中醫藥學方面的臨床教學和研究工作，並且不可作私人執業的【B】中醫；第三類為【C】中醫，他們可在中醫註冊過渡性安排下在香港合法地執業，直至食物及衞生局局長日後在憲報上公佈的日期為止。","blanks":[{"key":"A","answers":["註冊"]},{"key":"B","answers":["有限制註冊"]},{"key":"C","answers":["表列"]}],"unordered":[]},{"id":"單元三-20","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":20,"text":"香港是個交通極為頻繁的城市，每日乘搭公共交通工具的乘客超過【A】萬人次。本港的公共交通服務【B】高、收費【C】而種類繁多，包括鐵路、電車、巴士、公共小型巴士、的士和渡輪等公共交通工具。公共交通服務由私人營辦商或公營機構營辦，政府並無提供直接【D】。","blanks":[{"key":"A","answers":["1,100"]},{"key":"B","answers":["效率"]},{"key":"C","answers":["廉宜"]},{"key":"D","answers":["資助"]}],"unordered":[]},{"id":"單元三-21","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":21,"text":"香港是首個於公共運輸廣泛使用【A】貨幣的地區，目前本港最流通的電子車票兼貨幣系統名為【B】。","blanks":[{"key":"A","answers":["電子"]},{"key":"B","answers":["八達通"]}],"unordered":[]},{"id":"單元三-22","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":22,"text":"【A】管制站是香港最繁忙的管制站，在2025年，出入境旅客高達七千萬人次。","blanks":[{"key":"A","answers":["羅湖"]}],"unordered":[]},{"id":"單元三-23","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":23,"text":"香港的語文教育政策以提升學生「兩文三語」的能力為目標，期望中學畢業生都能夠書寫流暢的【A】和【B】，並有信心用【C】、英語和【D】與人交談。","blanks":[{"key":"A","answers":["中文"]},{"key":"B","answers":["英文"]},{"key":"C","answers":["廣東話"]},{"key":"D","answers":["普通話"]}],"unordered":[["A","B"]]},{"id":"單元三-24","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":24,"text":"香港【A】是負責推行本港大部分公營房屋計劃的法定機構。至於香港【B】則是一個獨立的法定機構，負責提供某些特定類別的資助房屋，協助滿足市民的住屋需要。","blanks":[{"key":"A","answers":["房屋委員會","房委會"]},{"key":"B","answers":["房屋協會"]}],"unordered":[]},{"id":"單元三-25","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":25,"text":"所有的士均可在香港【A】客運大樓、港珠澳大橋（香港口岸）公共運輸交匯處及香港【B】提供服務。","blanks":[{"key":"A","answers":["國際機場"]},{"key":"B","answers":["迪士尼樂園"]}],"unordered":[]},{"id":"單元三-26","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":26,"text":"海底隧道連接紅磡及【A】，實施雙程雙線行車，隧道於【B】年通車。","blanks":[{"key":"A","answers":["銅鑼灣"]},{"key":"B","answers":["1972"]}],"unordered":[]},{"id":"單元三-27","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":27,"text":"【A】隧道南行管道於 1967年通車，是香港第一條行車隧道，連接九龍塘及【B】。","blanks":[{"key":"A","answers":["獅子山"]},{"key":"B","answers":["大圍"]}],"unordered":[]},{"id":"單元三-28","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":28,"text":"【A】隧道為港珠澳大橋香港連接路的一部分，屬於禁區範圍。往珠海方向實施【B】線行車，往香港方向則實施【C】線行車。","blanks":[{"key":"A","answers":["觀景山"]},{"key":"B","answers":["四"]},{"key":"C","answers":["三"]}],"unordered":[]},{"id":"單元三-29","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":29,"text":"截至2026年2月，本港總共有【A】個水塘及【B】間濾水廠。為防止在輸送往用戶途中滋生細菌，食水中會保留微量的【C】，並加入【D】保護牙齒。","blanks":[{"key":"A","answers":["17"]},{"key":"B","answers":["18"]},{"key":"C","answers":["氯氣"]},{"key":"D","answers":["氟化物"]}],"unordered":[]},{"id":"單元三-30","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":30,"text":"政府鑑於香港的天然貯水地點不足，於【A】興建本港第一個「海中水庫」，該水庫的前期工程於1967年完成，先在新界【B】一個海灣的末端築【C】，然後抽出海水而建成。","blanks":[{"key":"A","answers":["船灣"]},{"key":"B","answers":["吐露港"]},{"key":"C","answers":["壩"]}],"unordered":[]},{"id":"單元三-31","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":31,"text":"康樂及文化事務舉辦各類文娛節目，為【A】學生、【B】人士及【C】人士提供各種票價優惠，藉以推廣表演及視覺藝術。","blanks":[{"key":"A","answers":["全日制"]},{"key":"B","answers":["高齡"]},{"key":"C","answers":["殘疾"]}],"unordered":[["B","C"]]},{"id":"單元三-32","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":32,"text":"衞生署於2008年11月啟動「中央器官捐贈」登記名冊，成功於【A】登記成為器官捐贈者，可毋需隨身攜帶【B】，因與器官捐贈有關的醫護人員在捐贈者身故後可從中央器官捐贈登記名冊中得悉其捐贈器官的意願。","blanks":[{"key":"A","answers":["網上"]},{"key":"B","answers":["器官捐贈證"]}],"unordered":[]},{"id":"單元三-33","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":33,"text":"香港的電力主要是由煤、【A】氣和【B】產生，同時亦有應用可再生能源，例如南丫島設有具商業規模的【C】和【D】發電站。","blanks":[{"key":"A","answers":["天然"]},{"key":"B","answers":["核能"]},{"key":"C","answers":["風力"]},{"key":"D","answers":["太陽能"]}],"unordered":[["C","D"]]},{"id":"單元三-34","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":34,"text":"香港的電力是由【A】有限公司和【B】有限公司供應。這兩家公司由投資者擁有，不以【C】方式經營，並已自願與【D】就其財政事宜訂立相互協議。","blanks":[{"key":"A","answers":["中華電力"]},{"key":"B","answers":["香港電燈"]},{"key":"C","answers":["專營權"]},{"key":"D","answers":["政府"]}],"unordered":[["A","B"]]},{"id":"單元三-35","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":35,"text":"天星小輪有限公司於【A】年成立，現時經營【B】條來往港内的渡輪航線。","blanks":[{"key":"A","answers":["1898"]},{"key":"B","answers":["兩"]}],"unordered":[]},{"id":"單元三-36","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":36,"text":"根據《吸煙（公眾衛生）條例》，現時法定禁煙區範圈包括所有食肆處所的【A】地方、公共交通工具、公共運輸設施、公眾遊樂場地和泳灘等，違者定額罰款港幣【B】元。","blanks":[{"key":"A","answers":["室內"]},{"key":"B","answers":["3,000"]}],"unordered":[]},{"id":"單元三-37","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":37,"text":"根據〈吸煙（公眾術生）條例〉規定，除【A】的控煙酒督察及【B】人員外，條例亦授權【C】事務署、【D】署及【E】署的指定人員，在他們管理的場地向違例者發出定額罰款通知書。","blanks":[{"key":"A","answers":["衛生署"]},{"key":"B","answers":["警務"]},{"key":"C","answers":["康樂及文化"]},{"key":"D","answers":["食物環境衞生","食環"]},{"key":"E","answers":["房屋"]}],"unordered":[["D","E"]]},{"id":"單元三-38","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":38,"text":"香港文化中心自【A】年啟用以來，一直是本港重要的演藝場地，更是訪港藝團和大型藝術節的主要演出場地，每年均有不少來自世界各地的知名藝人和本地主要藝術團在此演出，其配置的表演場地包括【B】、【C】和【D】。","blanks":[{"key":"A","answers":["1989"]},{"key":"B","answers":["音樂廳"]},{"key":"C","answers":["大劇院"]},{"key":"D","answers":["劇場"]}],"unordered":[["B","C","D"]]},{"id":"單元三-39","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":39,"text":"於1962年落成啟用的香港【A】，是香港歷史上第一所為市民而建的多用途文娛中心。低座設有【B】、劇院及展覽廳，而高座設有【C】、【D】及演奏廳等。","blanks":[{"key":"A","answers":["大會堂"]},{"key":"B","answers":["音樂廳"]},{"key":"C","answers":["婚姻登記處"]},{"key":"D","answers":["公共圖書館"]}],"unordered":[["C","D"]]},{"id":"單元三-40","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":40,"text":"於1984年成立的香港【A】提供表演藝術（即音樂、舞蹈、戲劇、舞台及製作藝術、電影電視及戲曲）的專業教育，就六個表演藝術範疇開辦【B】和專上教育課程。","blanks":[{"key":"A","answers":["演藝學院"]},{"key":"B","answers":["學士學位"]}],"unordered":[]},{"id":"單元三-41","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":41,"text":"位於【A】的香港藝術中心是一所【B】非牟利的非政府組織，多年來致力推動【C】文化的發展，中心主大樓配備劇場、電影院、畫廊、教室、工作室和餐廳等綜合設施。","blanks":[{"key":"A","answers":["灣仔"]},{"key":"B","answers":["自負盈虧"]},{"key":"C","answers":["當代藝術"]}],"unordered":[]},{"id":"單元三-42","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":42,"text":"香港政府於2021年公布《香港資源循環藍圖2035》，以 「【A】．資源循環．零廢堆填」為願景，積極推動社區回收，設立「【B】」社區回收網絡。","blanks":[{"key":"A","answers":["全民減廢"]},{"key":"B","answers":["綠在區區"]}],"unordered":[]},{"id":"單元三-43","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":43,"text":"將軍澳【A】第一階段已於2023年12月正式啟用，每年最高產量達到5,000萬立方米，最多為香港提供約【B】%的額外食水供應。","blanks":[{"key":"A","answers":["海水化淡廠"]},{"key":"B","answers":["5"]}],"unordered":[]},{"id":"單元三-44","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":44,"text":"為配合發展香港成為區域教育樞紐的政策，「非本地畢業生留港╱回港就業安排」於2008年5月19日推出。來自香港特區以外並在香港修讀經本地評審的【A】課程而獲得【B】或更高資歷的人士（非本地畢業生），可根據此安排申請留港╱回港工作。","blanks":[{"key":"A","answers":["全日制"]},{"key":"B","answers":["學位"]}],"unordered":[]},{"id":"單元三-45","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":45,"text":"由2010年8月1日起，凡年滿18歲的旅客可以免稅攜帶【A】公升在攝氏20度的溫度下量度所得酒精濃度以量計多於【B】%的飲用酒類進入香港，供其本人【C】。持香港身份證的旅客，則必須離港不少於【D】小時才可以享有以上豁免數量。","blanks":[{"key":"A","answers":["1"]},{"key":"B","answers":["30"]},{"key":"C","answers":["自用"]},{"key":"D","answers":["24"]}],"unordered":[]},{"id":"單元三-46","part":"第一部分：香港知識","unit":"單元三","unitTitle":"香港的民生和社會制度","num":46,"text":"由2010年8月1日起，凡年滿18歲的旅客可以免稅攜帶下列煙草產品進入香港，供其本人【A】：【B】支香煙；或1支雪茄(如多於1支雪茄，則總重量不超過【C】克)；或【D】克其他製成煙草。","blanks":[{"key":"A","answers":["自用"]},{"key":"B","answers":["19"]},{"key":"C","answers":["25"]},{"key":"D","answers":["25"]}],"unordered":[]},{"id":"單元四-1","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":1,"text":"香港一向實施寬鬆和開放的入境政策。現時約有【A】個國家和地區的國民，可獲免簽證來港旅遊【B】至【C】日不等。","blanks":[{"key":"A","answers":["170"]},{"key":"B","answers":["7"]},{"key":"C","answers":["180"]}],"unordered":[]},{"id":"單元四-2","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":2,"text":"昂坪360是一個香港的熱門旅遊景點，主要由昂坪纜車及昂坪市集組成。纜車全長【A】公里，單程車程約【B】分鐘，昂坪市集以【C】特色為建築主題。","blanks":[{"key":"A","answers":["5. 7"]},{"key":"B","answers":["25"]},{"key":"C","answers":["文化"]}],"unordered":[]},{"id":"單元四-3","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":3,"text":"昂坪廣場於2010年8月開幕，佔地約1.5公頃，廣場連接【A】寺、【B】大佛、昂坪360纜車、【C】市集及心經簡林。旅客亦可由昂坪廣場前往大嶼山其他別具特色的地方，包括【D】漁村、大嶼山【E】部優美的海灘等。","blanks":[{"key":"A","answers":["寶蓮"]},{"key":"B","answers":["天壇"]},{"key":"C","answers":["昂坪"]},{"key":"D","answers":["大澳"]},{"key":"E","answers":["南"]}],"unordered":[]},{"id":"單元四-4","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":4,"text":"沿寶蓮寺入口旁的昂坪【A】徑，步行約 15 分鐘，便到達鳳凰山山口的【B】，內有由【C】條梨花木木柱，木柱刻上共260字的《【D】心經》。","blanks":[{"key":"A","answers":["奇趣"]},{"key":"B","answers":["心經簡林"]},{"key":"C","answers":["38"]},{"key":"D","answers":["般若波羅蜜多"]}],"unordered":[]},{"id":"單元四-5","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":5,"text":"根據《旅遊業條例》，在新規管制度下，強迫購物和遺棄遊客等不良行為，已被【A】化。導遊必須在遊客抵達香港時將【B】分發給每位旅行團參加者，詳細列出所有【C】活動、【D】和其他費用的收費情況。","blanks":[{"key":"A","answers":["刑事"]},{"key":"B","answers":["行程表"]},{"key":"C","answers":["自費"]},{"key":"D","answers":["服務費"]}],"unordered":[]},{"id":"單元四-6","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":6,"text":"志蓮淨苑位於九龍【A】，是以【B】代【C】構古建築重建的【D】寺群。","blanks":[{"key":"A","answers":["鑽石山"]},{"key":"B","answers":["唐"]},{"key":"C","answers":["木"]},{"key":"D","answers":["佛"]}],"unordered":[]},{"id":"單元四-7","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":7,"text":"【A】祠是由嗇色園興建的香港最著名廟宇之一，供奉【B】師。據說該祠的【C】十分靈驗，每年農曆【D】，慕名而來的善信和遊人絡繹不絕。","blanks":[{"key":"A","answers":["黃大仙"]},{"key":"B","answers":["赤松黃大仙"]},{"key":"C","answers":["籤文"]},{"key":"D","answers":["大年初一"]}],"unordered":[]},{"id":"單元四-8","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":8,"text":"凌霄閣底層為【A】總站，位於凌霄閣最頂層的「【B】」是觀賞維港的絕佳地點。凌霄閣內設有各式商鋪，如果想在室內逛逛，可以到「香港【C】蠟像館」打卡。","blanks":[{"key":"A","answers":["山頂纜車"]},{"key":"B","answers":["摩天台428"]},{"key":"C","answers":["杜莎夫人"]}],"unordered":[]},{"id":"單元四-9","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":9,"text":"全港最高的室內觀景台是「【A】香港觀景台」，位於【B】廣場【C】樓。遊人可以 360 度鳥瞰維多利亞港的美景。觀景台設有多項【D】設施，生動地介紹香港獨特的歷史及文化，讓遊人深入了解香港。","blanks":[{"key":"A","answers":["天際100"]},{"key":"B","answers":["環球貿易"]},{"key":"C","answers":["100"]},{"key":"D","answers":["多媒體"]}],"unordered":[]},{"id":"單元四-10","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":10,"text":"太平山的高度是海拔【A】米，乃欣賞香港風景最佳的地方之一。遊人可以前往位於山頂凌霄閣旁邊的太平山【B】亭拍照，記錄及欣賞維多利亞港兩岸的景色。","blanks":[{"key":"A","answers":["552"]},{"key":"B","answers":["獅子"]}],"unordered":[]},{"id":"單元四-11","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":11,"text":"自香港回歸後，灣仔【A】每天早上【B】時均會舉行國旗及香港特區區旗升旗儀式，由香港【C】主持儀式。","blanks":[{"key":"A","answers":["金紫荊廣場"]},{"key":"B","answers":["八"]},{"key":"C","answers":["警務處"]}],"unordered":[]},{"id":"單元四-12","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":12,"text":"位於香港島南面的海洋公園，環山而建，佔地超過【A】萬平方公尺，公園分為「【B】樂園」及「【C】樂園」兩大景區，由架空纜車及海洋列車連接。","blanks":[{"key":"A","answers":["91"]},{"key":"B","answers":["海濱"]},{"key":"C","answers":["高峰"]}],"unordered":[["B","C"]]},{"id":"單元四-13","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":13,"text":"2024年8月大熊貓【A】於香港海洋公園誕下港產雙胞胎大熊貓寶寶，成為全球最【B】初次產子大熊貓。","blanks":[{"key":"A","answers":["盈盈"]},{"key":"B","answers":["年長"]}],"unordered":[]},{"id":"單元四-14","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":14,"text":"香港海洋公園特別提供不同口味的餐廳以供遊人選擇，【A】餐廳是香港第一間設於水族館內的餐廳。","blanks":[{"key":"A","answers":["海龍王"]}],"unordered":[]},{"id":"單元四-15","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":15,"text":"前往香港迪士尼樂園的遊客可乘搭港鐵迪士尼專線，從【A】站直達香港迪士尼樂園度假區。","blanks":[{"key":"A","answers":["欣澳"]}],"unordered":[]},{"id":"單元四-16","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":16,"text":"香港迪士尼樂園設有以太空科技和星際歷險為主題的【A】、以叢林歷險為主題的【B】、色彩繽紛和滿有童真的【C】大本營、恍似美國西部荒廢小鎮的【D】山谷、放滿探險家各式各樣收藏品的【E】莊園，以及於2023年開、猶如置身阿德爾王國的【F】世界等各個不同園區。","blanks":[{"key":"A","answers":["明日世界"]},{"key":"B","answers":["探險世界"]},{"key":"C","answers":["反斗奇兵"]},{"key":"D","answers":["灰熊"]},{"key":"E","answers":["迷離"]},{"key":"F","answers":["魔雪奇緣"]}],"unordered":[]},{"id":"單元四-17","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":17,"text":"鯉魚門位於觀塘東南部，1960年代起，鯉魚門逐漸發展成為馳名的【A】美食集中地。旅客來到鯉魚門，也可沿海旁漫步至【B】、【C】和【D】，近距離欣賞維多利亞港的醉人景色。","blanks":[{"key":"A","answers":["海鮮"]},{"key":"B","answers":["燈塔"]},{"key":"C","answers":["許願樹"]},{"key":"D","answers":["天后宮"]}],"unordered":[["B","C","D"]]},{"id":"單元四-18","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":18,"text":"香港抗戰及海防博物館位於香港島筲箕灣，以港島筲箕灣具百年歷史的鯉魚門【A】改建而成，是香港首間以【B】歷史為主題的博物館。","blanks":[{"key":"A","answers":["炮台"]},{"key":"B","answers":["海岸防衛"]}],"unordered":[]},{"id":"單元四-19","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":19,"text":"啟德郵輪碼頭位於昔日啟德香港國際機場【A】末端，是香港重要旅遊基建之一。碼頭設有【B】個泊位，可同時容納兩艘總噸位達【C】噸的大型郵輪。","blanks":[{"key":"A","answers":["跑道"]},{"key":"B","answers":["兩"]},{"key":"C","answers":["220,000"]}],"unordered":[]},{"id":"單元四-20","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":20,"text":"位於【A】的廖萬石堂屬於廖氏家族所有。廖氏的遠祖廖剛，父子五人都是高官，每人官祿兩千石，故以此為名。後人為紀念先祖，所以將【B】命名為廖萬石堂。","blanks":[{"key":"A","answers":["上水"]},{"key":"B","answers":["祠堂"]}],"unordered":[]},{"id":"單元四-21","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":21,"text":"三棟屋博物館位於新界荃灣，此處曾是新界歷史最悠久的【A】圍村之一，70年代興建荃灣地鐵站時所有村民已經遷出。三棟屋於1981年被列為【B】，並於1987年修建成為博物館，陳列了古老的【C】和日用品，開放予市民及旅客參觀。","blanks":[{"key":"A","answers":["客家"]},{"key":"B","answers":["法定古蹟"]},{"key":"C","answers":["農具"]}],"unordered":[]},{"id":"單元四-22","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":22,"text":"香港回歸紀念塔位於【A】海濱公園內，是紀念1997年香港回歸中國而興建的大型建築地標之一。香港回歸紀念塔是一座高【B】米的瞭望塔，旅客可登上塔頂，俯瞰整個海濱公園，以及毗鄰【C】。","blanks":[{"key":"A","answers":["大埔"]},{"key":"B","answers":["32.4"]},{"key":"C","answers":["吐露港"]}],"unordered":[]},{"id":"單元四-23","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":23,"text":"滘西洲島上的【A】是本港其中一個研究【B】代以至新石器時代香港歷史的重要古蹟，最近期的一次復修工程奪得2000年度聯合國教育、科學及文化組織首屆「【C】區文物古蹟保護傑出項目獎」。","blanks":[{"key":"A","answers":["洪聖古廟"]},{"key":"B","answers":["漢"]},{"key":"C","answers":["亞太"]}],"unordered":[]},{"id":"單元四-24","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":24,"text":"大埔林村於每年春節在村內的【A】旁舉行「【B】」，是香港在春節期間著名的地區習俗之一。現在政府禁止市民向許願樹投擲寶碟，改以樹桿由【C】製成的仿真細葉榕和祈福架取代。","blanks":[{"key":"A","answers":["天后廟"]},{"key":"B","answers":["林村樹掛"]},{"key":"C","answers":["玻璃鋼"]}],"unordered":[]},{"id":"單元四-25","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":25,"text":"圓玄學院為宗教聖地，供奉【A】、佛、道三教，內有一座仿照北京【B】建成的特色建築。學院還設有「【C】」存集三教的經典及中外研究書刊，為香港道教界最大的圖書館。","blanks":[{"key":"A","answers":["儒"]},{"key":"B","answers":["天壇"]},{"key":"C","answers":["藏經閣"]}],"unordered":[]},{"id":"單元四-26","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":26,"text":"車公廟紀念的車公是宋朝【A】，曾成功平定江南之亂。據說在南宋末年，【B】南下避難，一直獲車公護駕到香港。後來，車公不幸去世，後人為表其忠勇，便為他立廟供奉。","blanks":[{"key":"A","answers":["將軍"]},{"key":"B","answers":["宋帝昺"]}],"unordered":[]},{"id":"單元四-27","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":27,"text":"沙田車公廟現由【A】委員會大規模修葺和擴建而成。廟宇四面築有圍牆，正門兩旁擺放了一對【B】。廟宇為【C】式的建築，大殿名為「車公殿」。","blanks":[{"key":"A","answers":["華人廟宇"]},{"key":"B","answers":["石獅子"]},{"key":"C","answers":["一進"]}],"unordered":[]},{"id":"單元四-28","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":28,"text":"沿著中環的戶外【A】向上走，在荷李活道以南，史丹頓街、伊利近街至些利街一帶，可以找到「【B】美食區」，是蘭桂坊以西的新興飲食地帶。","blanks":[{"key":"A","answers":["自動扶梯"]},{"key":"B","answers":["SOHO","荷南"]}],"unordered":[]},{"id":"單元四-29","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":29,"text":"深水埗區是香港最早期的【A】中心之一，現已逐漸轉型為商業及【B】中心。「深水埗」之名的由來，據說是因為從前於現今北河街和通州街交界有一個深水【C】，而「埗」與「埠」的意思相通。不過，由於填海的關係，海岸線早已改變，現時該處已經找不到痕跡。","blanks":[{"key":"A","answers":["工商業"]},{"key":"B","answers":["物流"]},{"key":"C","answers":["碼頭"]}],"unordered":[]},{"id":"單元四-30","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":30,"text":"售賣無線電、收音機、錄音機、擴音器等零件和器材的【A】與長沙灣道一街之隔，20多年前已發展為「【B】」，店鋪和攤檔售賣的貨品價格一般比較便宜，而且貨品齊備，能為旅客提供另類的購物樂趣。","blanks":[{"key":"A","answers":["鴨寮街"]},{"key":"B","answers":["跳蚤市場"]}],"unordered":[]},{"id":"單元四-31","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":31,"text":"中銀大廈有70層樓高，由享譽全球的美籍華裔建築師【A】設計，建築設計靈感源自竹子的「節節高升」，由4個像似不同高度結晶體般的【B】柱身組成。","blanks":[{"key":"A","answers":["貝聿銘"]},{"key":"B","answers":["三角"]}],"unordered":[]},{"id":"單元四-32","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":32,"text":"大館內的三大法定古蹟包括前【A】、【B】及【C】，大館是昔日公眾對前【D】總部以至整個建築群的簡稱。大館於2019年獲頒聯合國教科文組織亞太區文化遺產保護獎【E】獎項，為此獎項中最高殊榮，肯定了活化計劃卓越的保育及活化成就。","blanks":[{"key":"A","answers":["中區警署"]},{"key":"B","answers":["域多利監獄"]},{"key":"C","answers":["中央裁判司署"]},{"key":"D","answers":["警察"]},{"key":"E","answers":["卓越"]}],"unordered":[["A","B","C"]]},{"id":"單元四-33","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":33,"text":"上環摩羅街分為摩羅上街及下街，是香港著名的【A】集散地，其英文街道名字「lascar」一詞源自葡萄牙語，指的是從南非開普角以東地區來的【B】。","blanks":[{"key":"A","answers":["古董"]},{"key":"B","answers":["水手"]}],"unordered":[]},{"id":"單元四-34","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":34,"text":"灣仔區原是港島北海岸的一個小漁村，由於地理上處於較低位置，昔日又稱為「【A】」。自1920年代起，政府在灣仔區進行數次大型【B】工程，築起今日的皇后大道東、告士打道及會議道等，灣仔區逐漸發展成現時的規模。","blanks":[{"key":"A","answers":["下環"]},{"key":"B","answers":["填海"]}],"unordered":[]},{"id":"單元四-35","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":35,"text":"於九龍的主題購物街很多。最著名的包括早期以售賣女人貨品為主的旺角【A】，以及位於油麻地、以大排檔美食及平價商品聞名的【B】夜市。","blanks":[{"key":"A","answers":["女人街","通菜街"]},{"key":"B","answers":["廟街"]}],"unordered":[]},{"id":"單元四-36","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":36,"text":"位於弼街至旺角道之間的另一段通菜街俗稱「【A】」，有各式各樣的【B】用品發售。此外，旺角的「【C】」亦是極富色彩的觀光市集，這裡有不少奇花異卉與家居盆栽任君選擇，附近的【D】則是香港鳥禽飼養者最喜愛流連的「雀鳥花園」。","blanks":[{"key":"A","answers":["金魚街"]},{"key":"B","answers":["水族"]},{"key":"C","answers":["花墟"]},{"key":"D","answers":["園圃街"]}],"unordered":[]},{"id":"單元四-37","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":37,"text":"觀塘海濱花園位於觀塘繞道旁，前身為觀塘公眾貨物【A】。花園有長約1公里的海濱步道，讓遊人近距離欣賞【B】和跑道公園、遠眺【C】的景色。","blanks":[{"key":"A","answers":["裝卸區"]},{"key":"B","answers":["啟德郵輪碼頭"]},{"key":"C","answers":["港島東"]}],"unordered":[]},{"id":"單元四-38","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":38,"text":"「【A】」一名的由來，流傳坊間的說法很多，當中最為人熟悉的是指從前該處有一棵巨大木棉樹，每當木棉花盛開時，乍看猶如一座「赤紅的木柱」。","blanks":[{"key":"A","answers":["赤柱"]}],"unordered":[]},{"id":"單元四-39","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":39,"text":"赤柱附近有多座歷史悠久的重要建築物，包括建於1767年南區最古舊的【A】、已列為法定古跡的舊赤柱【B】，還有屹立在赤柱廣場的【C】等。","blanks":[{"key":"A","answers":["天后廟"]},{"key":"B","answers":["警署"]},{"key":"C","answers":["美利樓"]}],"unordered":[]},{"id":"單元四-40","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":40,"text":"青馬大橋於【A】年5月通車，是當時連接大嶼山香港國際機場及市區的幹線公路。它不單是香港一個主要的建築標誌，更曾為全球最長的【B】及【C】兩用懸索吊橋。","blanks":[{"key":"A","answers":["1997"]},{"key":"B","answers":["行車"]},{"key":"C","answers":["鐵路"]}],"unordered":[["B","C"]]},{"id":"單元四-41","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":41,"text":"黃金海岸的【A】及【B】均採用歐陸式建築風格：桃紅色的外牆、圓拱形的窗框，還有亮麗的三角屋脊，是取景拍照的絕佳地點。","blanks":[{"key":"A","answers":["酒店"]},{"key":"B","answers":["購物商場"]}],"unordered":[["A","B"]]},{"id":"單元四-42","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":42,"text":"黃金沙灘位於青山公路 18 咪半，與【A】接連，總面積約7.85 公頃，全長 545 米，是【B】區最大的海灘，亦是全港首個【C】沙灘，鋪上的海沙由內地【D】運來，沙質幼細。","blanks":[{"key":"A","answers":["新咖啡灣"]},{"key":"B","answers":["屯門"]},{"key":"C","answers":["人造"]},{"key":"D","answers":["海南島"]}],"unordered":[]},{"id":"單元四-43","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":43,"text":"望夫石位於【A】區的紅梅谷對上一個矗立在西南面的小丘之上，海拔約 250 多米，是【B】山系的一座小山，外形仿似一個背著【C】的婦人。傳說有一個【D】的妻子每天等待下落不明的丈夫回來，有一天，忽然雷電大作，風雨交加，這個婦人和她的小孩就變成現時著名的望夫石。","blanks":[{"key":"A","answers":["沙田"]},{"key":"B","answers":["獅子"]},{"key":"C","answers":["小孩"]},{"key":"D","answers":["漁民"]}],"unordered":[]},{"id":"單元四-44","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":44,"text":"滘西洲公眾哥爾夫球場，是香港第一個不設【A】制度的公眾哥爾夫球場，場內設有三個【B】洞的高爾夫球場、一個有 60 條球道的練習場、短距離揮球練習場、高爾夫球用品專門店專門店及餐廳。","blanks":[{"key":"A","answers":["會籍"]},{"key":"B","answers":["18"]}],"unordered":[]},{"id":"單元四-45","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":45,"text":"「大澳漁村」沿著大澳灣邊上而建，村內的【A】是這個小漁村的地標。大澳文物酒店位於大澳石仔埗舊街【B】旁的一個小丘上，前身為建於1902年的大澳【C】。","blanks":[{"key":"A","answers":["水上棚屋"]},{"key":"B","answers":["渡輪碼頭"]},{"key":"C","answers":["警署"]}],"unordered":[]},{"id":"單元四-46","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":46,"text":"在香港吃的「中國菜」，其實一般都是【A】省菜式。","blanks":[{"key":"A","answers":["廣東"]}],"unordered":[]},{"id":"單元四-47","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":47,"text":"茶餐廳為香港文化的一部分，前身其實即是幾十年前「【A】」。茶餐廳的出現源於二十世紀中期，香港受西式生活習慣影響，一些華人喜歡上【B】或【C】，但不會光顧為外國人而設、收費昂貴的西餐廳，茶餐廳於是應運而生。","blanks":[{"key":"A","answers":["冰室"]},{"key":"B","answers":["飲西茶"]},{"key":"C","answers":["喝咖啡"]}],"unordered":[["B","C"]]},{"id":"單元四-48","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":48,"text":"香港美酒佳餚巡禮由香港【A】主辦，是亞洲大型飲食展覽之一，活動展示來自【B】的佳釀，是一個集美酒、美食、節慶和娛樂於一身的一項盛事。","blanks":[{"key":"A","answers":["旅遊發展局"]},{"key":"B","answers":["世界各地"]}],"unordered":[]},{"id":"單元四-49","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":49,"text":"在新界區，最佳的觀鳥點包括尖鼻咀、大帽山、燕崗（松柏塱）、【A】、【B】自然護理區和【C】自然保護區。","blanks":[{"key":"A","answers":["城門水塘"]},{"key":"B","answers":["大埔滘"]},{"key":"C","answers":["米埔"]}],"unordered":[]},{"id":"單元四-50","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":50,"text":"郊野公園約佔全港土地【A】%，公園內設有各種不同類型、【B】和【C】的郊遊路徑，供遊人作遠足或漫步，切合不同類型遊人的需求。","blanks":[{"key":"A","answers":["40"]},{"key":"B","answers":["長度"]},{"key":"C","answers":["難度"]}],"unordered":[["B","C"]]},{"id":"單元四-51","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":51,"text":"中西區位於香港島西北部，是香港開埠初期最早發展的社區之一。其後經濟發展，人口增加，政府多次【A】增闢土地，包括了現時的德輔道、干諾道和德輔道。","blanks":[{"key":"A","answers":["填海"]}],"unordered":[]},{"id":"單元四-52","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":52,"text":"九龍城古稱「【A】」，城內曾建有【B】座瞭望台，共開有城門【C】道，元明兩代均派有衙門駐軍，清代期間更興建【D】以加強防衛。","blanks":[{"key":"A","answers":["九龍寨城"]},{"key":"B","answers":["六"]},{"key":"C","answers":["四"]},{"key":"D","answers":["炮台"]}],"unordered":[]},{"id":"單元四-53","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":53,"text":"日軍佔據香港期間，由於要擴建【A】，九龍寨城的全部圍牆被拆去，只剩下城內的房屋。大戰之後，城寨範圍不斷擴展，直至【B】年中英國兩國政府達成全面清拆寨城協議。","blanks":[{"key":"A","answers":["機場"]},{"key":"B","answers":["1987"]}],"unordered":[]},{"id":"單元四-54","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":54,"text":"啟德體育園內的設施包括可容納50,000名觀眾的「啟德【A】」；提供一站式運動休閒、娛樂及購物體驗的「啟德【B】」；專為各種活動而設計的室內運動中心「啟德【C】」及設有5,000個座位的公眾運動場「啟德【D】」。","blanks":[{"key":"A","answers":["主場館"]},{"key":"B","answers":["零售館"]},{"key":"C","answers":["體藝館"]},{"key":"D","answers":["青年運動場"]}],"unordered":[]},{"id":"單元四-55","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":55,"text":"【A】眺望台位於深水埗區畢架山花園，這裡是俯覽九龍半島和【B】景致的絕佳地點。","blanks":[{"key":"A","answers":["龍翔道"]},{"key":"B","answers":["維多利亞港"]}],"unordered":[]},{"id":"單元四-56","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":56,"text":"現時香港全日24小時通關的出入境管制站包括：香港國際機場、港澳客輪碼頭、【A】和【B】。","blanks":[{"key":"A","answers":["落馬洲"]},{"key":"B","answers":["港珠澳大橋"]}],"unordered":[["A","B"]]},{"id":"單元四-57","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":57,"text":"香港儲水量最大的水庫是位於西貢的【A】。","blanks":[{"key":"A","answers":["萬宜水庫"]}],"unordered":[]},{"id":"單元四-58","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":58,"text":"香港佔地面積最大的購物商場是【A】，佔地200萬平方呎。","blanks":[{"key":"A","answers":["海港城"]}],"unordered":[]},{"id":"單元四-59","part":"第一部分：香港知識","unit":"單元四","unitTitle":"香港的旅遊概況","num":59,"text":"香港最長的道路是【A】，全長【B】公里。","blanks":[{"key":"A","answers":["青山公路"]},{"key":"B","answers":["52"]}],"unordered":[]},{"id":"單元五-1","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":1,"text":"在香港最為普及的宗教是【A】、【B】、【C】、【D】及【E】。","blanks":[{"key":"A","answers":["佛教"]},{"key":"B","answers":["天主教"]},{"key":"C","answers":["基督教"]},{"key":"D","answers":["伊斯蘭教"]},{"key":"E","answers":["道教"]}],"unordered":[["A","B","C","D","E"]]},{"id":"單元五-2","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":2,"text":"佛教於【A】時期傳入中國內地，大部份漢族地區信奉【B】佛教，西藏、內蒙等西北地區信奉【C】，雲南等少數民族地區信奉【D】佛教（南傳上部座佛教）。","blanks":[{"key":"A","answers":["西漢"]},{"key":"B","answers":["大乘"]},{"key":"C","answers":["喇嘛教"]},{"key":"D","answers":["小乘"]}],"unordered":[]},{"id":"單元五-3","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":3,"text":"《道藏》是道教經籍的總集，其中明代《【A】道藏》和《【B】道藏》共 5,485 卷，收有1,476 種著作。","blanks":[{"key":"A","answers":["正統"]},{"key":"B","answers":["萬曆續"]}],"unordered":[["A","B"]]},{"id":"單元五-4","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":4,"text":"道教宗旨追求【A】，有一整套修煉的方法，分為內養、【B】和房中術。","blanks":[{"key":"A","answers":["長生不死"]},{"key":"B","answers":["外養"]}],"unordered":[]},{"id":"單元五-5","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":5,"text":"中國農曆二月二十一日被稱為「【A】日」，又名「【B】開口日」，傳統習俗亦為【C】的日子，小人是指那些喜歡挑撥離間，惹是生非的人，亦可象徵無故惹來的是非或惡運。通過這個傳統儀式，可祈求【D】，化險為夷。","blanks":[{"key":"A","answers":["驚蟄"]},{"key":"B","answers":["白虎"]},{"key":"C","answers":["打小人"]},{"key":"D","answers":["消災解困"]}],"unordered":[]},{"id":"單元五-6","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":6,"text":"「拜太歲」是中國【A】文化的一個環節，也是民間一種化煞消災、祈福納吉的傳統習俗。六十太歲神的中央是一位長着【B】、三目及【C】的神尊，相傳是六十太歲神的【D】，被稱為「斗姆元君」，也稱斗姥元君。","blanks":[{"key":"A","answers":["道教"]},{"key":"B","answers":["四臉"]},{"key":"C","answers":["八臂"]},{"key":"D","answers":["母親"]}],"unordered":[["B","C"]]},{"id":"單元五-7","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":7,"text":"拜太歲的地點包括；油麻地榕樹頭【A】廟、荷李活道【B】廟、荃灣的【C】、屯門【D】、皇后大道中【E】和筲箕灣東大街天后廟。","blanks":[{"key":"A","answers":["天后"]},{"key":"B","answers":["文武"]},{"key":"C","answers":["圓玄學院"]},{"key":"D","answers":["青松觀"]},{"key":"E","answers":["洪聖古廟"]}],"unordered":[]},{"id":"單元五-8","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":8,"text":"天后誕以【A】灣的傳統祭典最為盛大，但最多姿多彩的慶典，還屬元朗的天后誕。除了可以觀賞繽紛熱鬧的「【B】」巡游、雜耍表演、舞獅及其它傳統民間表演之外，到元朗天后廟觀看進香人潮和善男信女投「【C】」的場面，也十分吸引人。","blanks":[{"key":"A","answers":["大廟"]},{"key":"B","answers":["飄色"]},{"key":"C","answers":["花炮"]}],"unordered":[]},{"id":"單元五-9","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":9,"text":"農曆正月廿六日是「【A】」的日子。坊間流傳仙間的【B】個護法羅漢，分別化身為【C】，前往觀音廟化緣，目的是為了試驗觀音大士的法力。慈悲為懷的觀音大士，於是大開倉庫，讓衪們享受【D】，其後更分賜給民間百姓享用。","blanks":[{"key":"A","answers":["觀音開庫"]},{"key":"B","answers":["五百"]},{"key":"C","answers":["和尚"]},{"key":"D","answers":["齋菜"]}],"unordered":[]},{"id":"單元五-10","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":10,"text":"農曆四月或五月長洲舉行【A】活動，又名「【B】節」，節目包括【C】巡遊、舞獅及各項宗教儀式等。據說清代期間，長洲曾遭遇一場風災，災后瘟疫流行，導致許多居民死亡，島上居民便發起了活動，替居民【D】和為死去的人超度亡魂。","blanks":[{"key":"A","answers":["太平清醮"]},{"key":"B","answers":["包山"]},{"key":"C","answers":["飄色"]},{"key":"D","answers":["祈福"]}],"unordered":[]},{"id":"單元五-11","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":11,"text":"天干和地支共有【A】個天干和【B】個地支。天干和地支組合便成為以「【C】」為首的六十干支【D】。","blanks":[{"key":"A","answers":["十"]},{"key":"B","answers":["十二"]},{"key":"C","answers":["甲子"]},{"key":"D","answers":["循環"]}],"unordered":[]},{"id":"單元五-12","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":12,"text":"一年有【A】個節氣，在月首的稱「節」，月中的稱「中氣」，簡稱為「氣」。據說，節氣是【B】氏制訂出來的。","blanks":[{"key":"A","answers":["二十四"]},{"key":"B","answers":["神農"]}],"unordered":[]},{"id":"單元五-13","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":13,"text":"傳統的廣東婚禮，一般都是先由「【A】」在兩家之間奔走撮合。古時的婚禮要經過「【B】」及「【C】」程序才算正式完婚。","blanks":[{"key":"A","answers":["媒人"]},{"key":"B","answers":["三書"]},{"key":"C","answers":["六禮"]}],"unordered":[["B","C"]]},{"id":"單元五-14","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":14,"text":"「盂蘭節」源自一個關於【A】超渡【B】及一眾亡魂的典故，這個傳說一直流傳後世，逐漸形成一種民間習俗。","blanks":[{"key":"A","answers":["目連"]},{"key":"B","answers":["亡母"]}],"unordered":[]},{"id":"單元五-15","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":15,"text":"道教的八仙包括：【A】、【B】、【C】、藍采和、【D】、張果老、漢鍾離和曹國舅。","blanks":[{"key":"A","answers":["鐵柺李"]},{"key":"B","answers":["何仙姑"]},{"key":"C","answers":["呂洞賓"]},{"key":"D","answers":["韓湘子"]}],"unordered":[["A","B","C","D"]]},{"id":"單元五-16","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":16,"text":"「太平洪朝」是粉嶺圍【A】氏在每年正月十五和十六日舉行的的大型宗族性祭祀活動。「太平洪朝」宗族性祭祀活動中，有「搶雞毛」及「扒船」的傳統活動。雞毛代表【B】，奪得雞毛者，來年就會諸事順利。「扒船」儀式的目的為淨化社區，由【C】名村內男丁抬住【D】船走遍千間屋，沿門逐疫，收集村民「不潔之物」。最後將不潔東西和紙船火化，以示送走災害和疾病。","blanks":[{"key":"A","answers":["彭"]},{"key":"B","answers":["吉利"]},{"key":"C","answers":["8"]},{"key":"D","answers":["紙"]}],"unordered":[]},{"id":"單元五-17","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":17,"text":"中國傳統節日中，除了有農曆新年， 還有【A】、【B】、【C】和【D】四個主要節日。","blanks":[{"key":"A","answers":["清明節"]},{"key":"B","answers":["端午節"]},{"key":"C","answers":["中秋節"]},{"key":"D","answers":["重陽節"]}],"unordered":[["A","B","C","D"]]},{"id":"單元五-18","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":18,"text":"漁民婚禮傳統儀式中，準新娘會【A】她的家人、準新郎及媒人等，原因是她要有好一段時間不能回到娘家。","blanks":[{"key":"A","answers":["哭罵"]}],"unordered":[]},{"id":"單元五-19","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":19,"text":"結婚當天，廣東新娘會和丈夫跪拜【A】。在古時，這是婚禮被認受的象徵。新娘會於結婚後【B】天回娘家探望家人，她的丈夫會帶同【C】回去，以求婚姻一切如意。","blanks":[{"key":"A","answers":["祖先"]},{"key":"B","answers":["三"]},{"key":"C","answers":["乳豬"]}],"unordered":[]},{"id":"單元五-20","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":20,"text":"春節是香港人最重視的節日之一，喜慶氣氛十分濃厚。市民在年三十晚吃過年夜飯後會去逛【A】，從大年初一到【B】期間，親友們都會給未婚男女派送【C】。","blanks":[{"key":"A","answers":["花市"]},{"key":"B","answers":["元宵","新十五"]},{"key":"C","answers":["紅包","利是"]}],"unordered":[]},{"id":"單元五-21","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":21,"text":"春節期間香港會舉行不同的大型喜慶活動賀歲，大年初一有【A】巡遊，聯同本地和國際表演隊伍，演出街頭雜技、音樂演奏等節目；大年初二晚上，維多利亞港都會舉行【B】匯演，九龍尖沙咀海旁和香港中環海旁一帶，是人們觀看煙火最佳地帶；年初三在沙田舉行的賀歲【C】，也是春節的主要節目。","blanks":[{"key":"A","answers":["花車"]},{"key":"B","answers":["煙花"]},{"key":"C","answers":["賽馬"]}],"unordered":[]},{"id":"單元五-22","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":22,"text":"每年中秋前後一連三晚（農歷八月十四、十五、十六），【A】居民都會在區內的大街小巷舞火龍遊行，祈求合境平安。在最後一晚，還有「【B】」儀式。功成身退的火龍，會被送到銅鑼灣【C】拋下海去。但1982年後，為了環保，儀式過後，有關當局會馬上派人把火龍撈上來，送到 焚化爐焚化。","blanks":[{"key":"A","answers":["大坑"]},{"key":"B","answers":["龍歸天"]},{"key":"C","answers":["避風塘"]}],"unordered":[]},{"id":"單元五-23","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":23,"text":"康文署屬下有 7 間主要博物館，包括：以保存中國文化遺產以及推廣本地藝術為任務的香港【A】館；採用互動式展品說明各種科學原理及科技如何改善生活質素的香港【B】館；以教育及娛樂並重的方式，為參觀者提供天文及太空科學知識的香港【C】館；提供涵蓋歷史、藝術及文化各範疇等綜合性資訊的香港文化博物館；搜集、保存、整理、研究和展覽與香港及華南地區的考古、歷史、民俗及自然歷史有關文物的香港【D】博物館；以本港過去600年海防歷史為主題的香港【E】博物館及全面地闡述孫中山先生事跡的孫中山紀念館。","blanks":[{"key":"A","answers":["藝術"]},{"key":"B","answers":["科學"]},{"key":"C","answers":["太空"]},{"key":"D","answers":["歷史"]},{"key":"E","answers":["抗戰及海防"]}],"unordered":[]},{"id":"單元五-24","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":24,"text":"康文署屬下有 8 間小規模的博物館，包括：以專題推廣中國茶藝文化的【A】館；展出漢墓出土文物及有關漢代日常生活和文化歷史的【B】博物館；展覽有關客家村屋的背景和修復及反映當時民俗生活的【C】民俗館、上窰民俗文物館及【D】博物館；以舊大埔墟火車站大樓、古老車卡、蒸氣火車頭及柴油電動機車頭等構成的香港【E】博物館；見證香港消防歷史的【F】滅火輪展覽館；及專責蒐集和保存香港電影及相關物品的香港電影資料館。","blanks":[{"key":"A","answers":["茶具文物"]},{"key":"B","answers":["李鄭屋漢墓"]},{"key":"C","answers":["羅屋"]},{"key":"D","answers":["三棟屋"]},{"key":"E","answers":["鐵路"]},{"key":"F","answers":["葛量洪號"]}],"unordered":[]},{"id":"單元五-25","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":25,"text":"康文署轄下的兩個文化空間包括：前身為香港【A】會的「油街實現」，是一座【B】級歷史建築，現時是一個全新的藝術空間，推廣及展示本地當代【C】藝術。另外，由昔日【D】改建而成的香港視覺藝術中心，糅合【E】世紀西方的建築風格與現代元素，為藝術工作提供研習場所，並舉辦各類型藝術活動。","blanks":[{"key":"A","answers":["皇家遊艇"]},{"key":"B","answers":["二"]},{"key":"C","answers":["視覺"]},{"key":"D","answers":["英軍營房"]},{"key":"E","answers":["十九"]}],"unordered":[]},{"id":"單元五-26","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":26,"text":"【A】辦事處負責管理香港文物探知館。香港文物探知館位處【B】前威菲路軍營 S61 及 S62 座，致力向公眾展示和闡釋有關考古及歷史建築的【C】工作，藉此增進市民對共同擁有的【D】的認識，探索及享受當中的樂趣，並肯定文物保育的價值。","blanks":[{"key":"A","answers":["古物古蹟"]},{"key":"B","answers":["九龍公園"]},{"key":"C","answers":["文物保護"]},{"key":"D","answers":["文化遺產"]}],"unordered":[]},{"id":"單元五-27","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":27,"text":"香港的公共圖書館的自動化系統，是世界上最大型的【A】兼容圖書館自動化系統之一。","blanks":[{"key":"A","answers":["雙語"]}],"unordered":[]},{"id":"單元五-28","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":28,"text":"西九文化區是香港特區政府為配合香港長遠的【A】基建及發展需要所作出的一項重要策略性投資，政府為此成立【B】機構西九文化區管理局，負責推展計劃。","blanks":[{"key":"A","answers":["文化藝術"]},{"key":"B","answers":["法定"]}],"unordered":[]},{"id":"單元五-29","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":29,"text":"M+是一個嶄新的【A】，致力於收藏、展示與詮釋二十及二十一世紀的【B】、設計及【C】、流動影像，以及香港視覺文化。","blanks":[{"key":"A","answers":["博物館"]},{"key":"B","answers":["視覺藝術"]},{"key":"C","answers":["建築"]}],"unordered":[]},{"id":"單元五-30","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":30,"text":"香港文化博物館採用中國傳統【A】佈局，並揉合現代建築技巧，別具特色。全館樓高【B】層，總面積達28,500平方米。","blanks":[{"key":"A","answers":["四合院"]},{"key":"B","answers":["5"]}],"unordered":[]},{"id":"單元五-31","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":31,"text":"香港故宮文化博物館位於西九文化區【A】端，是西九文化區管理局與【B】博物院的合作項目，由【C】撥捐35億港元成立，並於2023至2031年期間支持其部分年度大型展覽及教育項目。","blanks":[{"key":"A","answers":["西"]},{"key":"B","answers":["故宮"]},{"key":"C","answers":["香港賽馬會"]}],"unordered":[]},{"id":"單元五-32","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":32,"text":"戲曲中心的外型以一盞傳統中國【A】為設計概念，糅合傳統與現代元素，流線外型及半開放的中庭空間體現「【B】」的概念，主要設施包括設備先進的大劇院、精緻的【C】劇場、四個專業排演室及一個演講廳等。","blanks":[{"key":"A","answers":["彩燈"]},{"key":"B","answers":["氣"]},{"key":"C","answers":["茶館"]}],"unordered":[]},{"id":"單元五-33","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":33,"text":"香港漁民視天后為海上守護神，信眾甚多，每逢農曆【A】的天后誕辰，漁民都會在漁船上張燈結彩，集合前往天后廟前參拜，以祈求來年風調雨順。","blanks":[{"key":"A","answers":["三月二十三日"]}],"unordered":[]},{"id":"單元五-34","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":34,"text":"傳統的廣東婚禮過程中所用的文書，包括【A】、禮書和迎書。由求婚至完婚的整個結婚過程，包括納采、【B】、納吉、納徵、請期和【C】。","blanks":[{"key":"A","answers":["聘書"]},{"key":"B","answers":["問名"]},{"key":"C","answers":["親迎"]}],"unordered":[["B","C"]]},{"id":"單元五-35","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":35,"text":"根據首份「香港非物質文化遺產代表作名錄」，具有高文化價值和急需保存的表演藝術項目包括：西貢坑口客家【A】、全真道堂科儀音樂、【B】和【C】。","blanks":[{"key":"A","answers":["舞麒麟"]},{"key":"B","answers":["粵劇"]},{"key":"C","answers":["南音"]}],"unordered":[["B","C"]]},{"id":"單元五-36","part":"第一部分：香港知識","unit":"單元五","unitTitle":"香港的文化與風俗","num":36,"text":"根據首份「香港非物質文化遺產代表作名錄」，具有高文化價值和急需保存的傳統手工藝包括：【A】（斲琴技藝）、港式【B】製作技藝、紮作技藝、香港中式長衫和【C】製作技藝、【D】搭建技藝等。","blanks":[{"key":"A","answers":["古琴藝術"]},{"key":"B","answers":["奶茶"]},{"key":"C","answers":["裙褂"]},{"key":"D","answers":["戲棚"]}],"unordered":[]},{"id":"單元六及八-1","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":1,"text":"為香港取得史上首面奧運金牌的運動員是【A】，她於一九九六年美國亞特蘭大奧運會【B】項目上力壓群雌奪冠。","blanks":[{"key":"A","answers":["李麗珊"]},{"key":"B","answers":["滑浪風帆"]}],"unordered":[]},{"id":"單元六及八-2","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":2,"text":"「【A】」佈滿了逾百顆「星星」的牌匾，展示了逾百個經典巨星的【B】和【C】。遊人可用智能手機掃描牌匾上的二維碼，瀏覽巨星簡介和收看經精心挑選的【D】。","blanks":[{"key":"A","answers":["星光大道"]},{"key":"B","answers":["掌印"]},{"key":"C","answers":["簽名"]},{"key":"D","answers":["電影短片"]}],"unordered":[["B","C"]]},{"id":"單元六及八-3","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":3,"text":"「星光大道」於2019重開後，卡通人物【A】銅像、【B】女神和明星銅像的底座都已翻新，遊人更可利用【C】技術與李小龍及梅艷芳互動合照。","blanks":[{"key":"A","answers":["麥兜"]},{"key":"B","answers":["金像奬"]},{"key":"C","answers":["AR","擴增實境"]}],"unordered":[]},{"id":"單元六及八-4","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":4,"text":"在本港，只有「香港【A】」才是政府唯一認可營辦賽馬、六合彩及【B】博彩活動的機構。","blanks":[{"key":"A","answers":["賽馬會"]},{"key":"B","answers":["足球"]}],"unordered":[]},{"id":"單元六及八-5","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":5,"text":"在香港進行賽馬投注，一場賽事選中第一名馬匹稱為【A】；一場賽事選中第一、第二或第三名馬匹稱為【B】； 一場賽事不論次序選中第一及第二名稱為【C】；一場賽事選中前三名馬匹任何兩匹稱為【D】；一場賽事順序選中第一、第二及第三名馬匹稱為【E】。","blanks":[{"key":"A","answers":["獨贏"]},{"key":"B","answers":["位置"]},{"key":"C","answers":["連贏"]},{"key":"D","answers":["位置Q"]},{"key":"E","answers":["三重彩"]}],"unordered":[]},{"id":"單元六及八-6","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":6,"text":"《【A】：殲滅世紀》曾在【B】益豐大廈天台取景；《【C】：黑夜之神》、《盜墓者羅拉：生命之匙》曾在【D】二期取景。","blanks":[{"key":"A","answers":["變形金剛"]},{"key":"B","answers":["土瓜灣"]},{"key":"C","answers":["蝙蝠俠"]},{"key":"D","answers":["國際金融中心"]}],"unordered":[]},{"id":"單元六及八-7","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":7,"text":"遠足活動在香港日趨普遍。根據漁護署的資料，深受遠足人士歡迎的四條長途遠足徑包括：【A】徑、【B】徑、【C】徑及【D】徑。為向市民介紹不同遠足路線，康文署印發《【E】》小冊子及特設網頁提供相關資料。","blanks":[{"key":"A","answers":["麥理浩"]},{"key":"B","answers":["鳳凰"]},{"key":"C","answers":["港島"]},{"key":"D","answers":["衛奕信"]},{"key":"E","answers":["行山樂"]}],"unordered":[["A","B","C","D"]]},{"id":"單元六及八-8","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":8,"text":"香港藝術中心【A】電影院是首個以香港演員命名的電影院。","blanks":[{"key":"A","answers":["古天樂"]}],"unordered":[]},{"id":"單元六及八-9","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":9,"text":"香港電影資料館坐落於港島東【A】海傍的永久館址於2001年啟用，樓高五層，樓面總面積約【B】平方米，設有小型【C】、展覽廳、資源中心、藏品庫及【D】工作室。","blanks":[{"key":"A","answers":["西灣河"]},{"key":"B","answers":["7,200"]},{"key":"C","answers":["電影院"]},{"key":"D","answers":["修復"]}],"unordered":[]},{"id":"單元六及八-10","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":10,"text":"香港電影資料館致力搜集電影資料，藏品主要來自【A】及公眾的捐贈。為提高公眾對香港電影及歷史文化的興趣和認識，資料館定期舉辦【B】、展覽、座談會等活動，並出版專題【C】。","blanks":[{"key":"A","answers":["業界"]},{"key":"B","answers":["電影放映"]},{"key":"C","answers":["書籍"]}],"unordered":[]},{"id":"單元六及八-11","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":11,"text":"香港電影分級制度於1988年立法制定，將電影分為【A】個級別。其中第 IIA級、 IIB級的分級只屬【B】，沒有強制性的法律規限。第III級電影則強制禁止【C】歲以下人士觀看。","blanks":[{"key":"A","answers":["三"]},{"key":"B","answers":["勸喻"]},{"key":"C","answers":["18"]}],"unordered":[]},{"id":"單元六及八-12","part":"第一部分：香港知識","unit":"單元六及八","unitTitle":"香港電影文化、體育及消閒活動","num":12,"text":"近年來，最受香港人歡迎的旅遊目的地為【A】、台北、首爾及曼谷。一般來説，年輕人較多選擇以【B】方式出行。","blanks":[{"key":"A","answers":["東京"]},{"key":"B","answers":["自遊行"]}],"unordered":[]},{"id":"單元七-1","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":1,"text":"香港的貿易政策建基於世界貿易組織（世貿組織）奉行的【A】制度。作為全球最外向型和【B】的經濟體之一，香港致力推動貿易和【C】全球化，並以「【D】」的名義積極參與世貿組織。","blanks":[{"key":"A","answers":["多邊貿易"]},{"key":"B","answers":["開放"]},{"key":"C","answers":["服務"]},{"key":"D","answers":["中國香港"]}],"unordered":[]},{"id":"單元七-2","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":2,"text":"服務業對本港經濟得十分重要。香港最主要的服務行業包括金融及【A】業，其次是公共行政、社會及【B】業，然後是【C】貿易、批發及零售業。","blanks":[{"key":"A","answers":["保險"]},{"key":"B","answers":["個人服務"]},{"key":"C","answers":["進出口"]}],"unordered":[]},{"id":"單元七-3","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":3,"text":"除股票及期貨市場外，本港亦有一個活躍的【A】市場，該市場主要由【B】參與運作及使用，而涉及的產品包括與股票、利率及【C】有關的掉期、遠期及期權合約。香港【D】有限公司附屬公司香港場外結算有限公司已於2013年11月投入運作，為若干類別的場外衍生產品結算提供服務。","blanks":[{"key":"A","answers":["場外交易"]},{"key":"B","answers":["專業機構"]},{"key":"C","answers":["貨幣"]},{"key":"D","answers":["交易及結算所"]}],"unordered":[]},{"id":"單元七-4","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":4,"text":"香港是全球最開放的保險業中心之一。本港大部份保險公司在香港註冊成立，其餘分別在內地或20個海外國家註冊成立，當中以百慕達，【A】及【B】最多。近年，香港的保險業市場每年都有良好的增長。","blanks":[{"key":"A","answers":["英國"]},{"key":"B","answers":["美國"]}],"unordered":[["A","B"]]},{"id":"單元七-5","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":5,"text":"香港是一個【A】港，一般進口或出口貨物均毋須繳付關稅，但有數類在香港使用的貨品，不論是從外地輸入或在本港製造，均須課稅。這些應課稅品包括酒精濃度多於【B】%的酒類、【C】、【D】、飛機燃油、汽油以及輕質【E】。所有輸入、輸出、製造或儲存這些貨品的商戶，均須領有【F】。","blanks":[{"key":"A","answers":["自由"]},{"key":"B","answers":["30"]},{"key":"C","answers":["煙草"]},{"key":"D","answers":["甲醇"]},{"key":"E","answers":["柴油"]},{"key":"F","answers":["牌照"]}],"unordered":[["C","D"]]},{"id":"單元七-6","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":6,"text":"至2023年，香港服務業的就業人數佔總就業人數超過【A】成。","blanks":[{"key":"A","answers":["八"]}],"unordered":[]},{"id":"單元七-7","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":7,"text":"工貿署一直與內地保持緊密磋商，在《內地與香港關於建立【A】的安排》（CEPA）框架下不斷加入更多開放措施，亦積極尋求與香港的貿易伙伴締結【B】協定及促進和保護【C】協定，從而為本港的產品及服務出口以及本港投資者在海外的投資爭取更有利的條件。","blanks":[{"key":"A","answers":["更緊密經貿關係"]},{"key":"B","answers":["自由貿易"]},{"key":"C","answers":["投資"]}],"unordered":[]},{"id":"單元七-8","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":8,"text":"《內地與香港關於建立更緊密經貿關係的安排》（CEPA）是內地及香港【A】份簽訂的自貿協定，於【B】年簽署，並於【C】年1月1日全面實施。","blanks":[{"key":"A","answers":["首"]},{"key":"B","answers":["2003"]},{"key":"C","answers":["2004"]}],"unordered":[]},{"id":"單元七-9","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":9,"text":"博彩稅是向賽馬博彩的投注所得的毛利、【A】收益及合法足球博彩的投注所得的毛利徵收的稅項。本地賽事的賽馬博彩稅按毛利以72.5%至【B】%的累進稅率收稅，越洋轉播海外賽事的賽馬博彩稅則按毛利以劃一【C】%的稅率收稅。","blanks":[{"key":"A","answers":["六合彩"]},{"key":"B","answers":["75"]},{"key":"C","answers":["72.5"]}],"unordered":[]},{"id":"單元七-10","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":10,"text":"六合彩稅率為收益的【A】%；而足球博彩稅率則為毛利的【B】%。","blanks":[{"key":"A","answers":["25"]},{"key":"B","answers":["50"]}],"unordered":[]},{"id":"單元七-11","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":11,"text":"透過發展人民幣【A】、貸款和【B】類產品，香港已成為最大的【C】人民幣融資中心。香港同時成為世界各地企業和金融機構進行人民幣【D】、支付、融資及投資的平台。","blanks":[{"key":"A","answers":["債券"]},{"key":"B","answers":["股票"]},{"key":"C","answers":["離岸"]},{"key":"D","answers":["貿易結算"]}],"unordered":[["A","B"]]},{"id":"單元七-12","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":12,"text":"香港實行【A】稅制，納稅人按三種不同的入息來源的評稅繳付稅款。該三種入息來源分別為營業利潤、【B】及【C】收入。此外，個人可按個人入息課稅辦法，將從各來源所得的總入息【D】課稅。","blanks":[{"key":"A","answers":["分類"]},{"key":"B","answers":["薪酬"]},{"key":"C","answers":["物業租金"]},{"key":"D","answers":["合併"]}],"unordered":[]},{"id":"單元七-13","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":13,"text":"香港的轉口貨品，以【A】、【B】和用具及零件佔據轉口總值首位，其次是【C】、錄音及【D】設備和儀器。","blanks":[{"key":"A","answers":["電動機械"]},{"key":"B","answers":["儀器"]},{"key":"C","answers":["通訊"]},{"key":"D","answers":["音響"]}],"unordered":[]},{"id":"單元七-14","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":14,"text":"香港轉口貿易的主要市場是【A】、【B】、【C】、【D】和越南。","blanks":[{"key":"A","answers":["內地"]},{"key":"B","answers":["美國"]},{"key":"C","answers":["印度"]},{"key":"D","answers":["台灣"]}],"unordered":[["A","B","C","D"]]},{"id":"單元七-15","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":15,"text":"香港出口產品主要項目包括【A】、【B】及銀器，及其他寶石或半寶石製成品；非【C】金屬；以及醫療及【D】產品。主要市場是內地、【E】、美國、英國及瑞士。","blanks":[{"key":"A","answers":["首飾"]},{"key":"B","answers":["金器"]},{"key":"C","answers":["鐵"]},{"key":"D","answers":["藥用"]},{"key":"E","answers":["台灣"]}],"unordered":[["A","B"]]},{"id":"單元七-16","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":16,"text":"中小企業是推動香港經濟發展的一股重要力量，佔全港商業單位總數逾【A】%，為逾【B】萬人提供了就業機會。","blanks":[{"key":"A","answers":["98"]},{"key":"B","answers":["120"]}],"unordered":[]},{"id":"單元七-17","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":17,"text":"香港【A】是依據法例成立的法定機構，專責推動本地貨物和服務貿易出口，在世界各地設有辦事處，致力推廣本港作為【B】環球投資及商業樞紐。","blanks":[{"key":"A","answers":["貿易發展局"]},{"key":"B","answers":["雙向"]}],"unordered":[]},{"id":"單元七-18","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":18,"text":"香港的外匯市場發展成熟，買賣活躍。由於本港沒有【A】，且位於有利的【B】，有助外匯市場的發展。","blanks":[{"key":"A","answers":["外匯管制"]},{"key":"B","answers":["時區"]}],"unordered":[]},{"id":"單元七-19","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":19,"text":"香港在2000年12月開始推行強積金制度，要求符合法例訂明的【A】及僱員【B】性供款，目的是協助市民滾存退休資產。","blanks":[{"key":"A","answers":["僱主"]},{"key":"B","answers":["強制"]}],"unordered":[]},{"id":"單元七-20","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":20,"text":"根據2024年的統計數字，在香港從事【A】、社會、康樂藝術及【B】服務業的人數最多，其次是從事進出口貿易、批發、【C】、住宿及【D】服務業。以上行業的就業人數佔本港超過50%的就業人口。","blanks":[{"key":"A","answers":["公共行政"]},{"key":"B","answers":["個人"]},{"key":"C","answers":["零售"]},{"key":"D","answers":["膳食"]}],"unordered":[]},{"id":"單元七-21","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":21,"text":"在2024年，本港僱員（不包括政府僱員和《最低工資條例》所豁免的實習學員、工作經驗學員和留宿家庭傭工）的每月工資中位數為港幣【A】元。","blanks":[{"key":"A","answers":["20,500"]}],"unordered":[]},{"id":"單元七-22","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":22,"text":"【A】基金是用以支付香港政府在法定公共機構所作出的投資，而這些機構並非屬於政府架構，例如注入香港鐵路有限公司的資本及在房屋委員會作出的資本投資等。基金的收入主要來自政府一般收入帳目的撥款、償還的貸款、投資收入，以及來自投資或貸款的【B】及利息。","blanks":[{"key":"A","answers":["基本投資"]},{"key":"B","answers":["股息"]}],"unordered":[]},{"id":"單元七-23","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":23,"text":"香港的貨幣政策目標是維持貨幣穩定。從【A】年10月開始實行【B】制度，以維持1美元兌【C】港元的固定匯率。","blanks":[{"key":"A","answers":["1983"]},{"key":"B","answers":["聯繫匯率"]},{"key":"C","answers":["7.8"]}],"unordered":[]},{"id":"單元七-24","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":24,"text":"香港政府透過香港金融管理局授權三家商業銀行在香港發行銀行紙幣，這三家銀行分別為香港【A】銀行有限公司、【B】銀行（香港）有限公司和【C】銀行（香港）有限公司。","blanks":[{"key":"A","answers":["上海匯豐"]},{"key":"B","answers":["渣打"]},{"key":"C","answers":["中國"]}],"unordered":[["B","C"]]},{"id":"單元七-25","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":25,"text":"本港的硬幣由香港政府發行，面額為【A】元、5元、2元、1元、5角、2角和1角。1993年政府推出【B】設計硬幣，取代原來的【C】設計系列。","blanks":[{"key":"A","answers":["10"]},{"key":"B","answers":["洋紫荊"]},{"key":"C","answers":["英女皇頭像"]}],"unordered":[]},{"id":"單元七-26","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":26,"text":"「中小企業支援與諮詢中心」（英文簡稱 SUCCESS）的網站為有意創業人士，提供與創業有關的詳盡資料，包括草擬【A】須知、【B】分析、策劃成本/支出的分析等。","blanks":[{"key":"A","answers":["計劃書"]},{"key":"B","answers":["市場"]}],"unordered":[]},{"id":"單元七-27","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":27,"text":"香港股票市場上有多元化的投資產品，包括普通股份、【A】、認股權證、【B】、交易所買賣基金、【C】投資信託基金，以及單位信託及債務證券，供投資者進行買賣。","blanks":[{"key":"A","answers":["期權"]},{"key":"B","answers":["牛熊證"]},{"key":"C","answers":["房地產"]}],"unordered":[["A","B"]]},{"id":"單元七-28","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":28,"text":"香港的《僱傭條例》為符合相關規定的僱員提供多項福利及保障，例如休息日、有薪【A】、有薪【B】、有薪【C】、疾病津貼、生育保障及僱傭保障。","blanks":[{"key":"A","answers":["法定假日"]},{"key":"B","answers":["年假"]},{"key":"C","answers":["侍產假"]}],"unordered":[["A","B","C"]]},{"id":"單元七-29","part":"第一部分：香港知識","unit":"單元七","unitTitle":"香港的主要經濟活動","num":29,"text":"在香港進行涉及【A】、【B】轉讓及股份轉讓的交易時，相關交易文件均須繳納印花稅，否則不具法律效力。","blanks":[{"key":"A","answers":["租約"]},{"key":"B","answers":["不動產"]}],"unordered":[]},{"id":"單元九-1","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":1,"text":"「風水」一詞早見於傳說是【A】朝郭璞所作的《【B】》。「風」和「水」分別代表【C】之氣，集合兩者，便涵蓋了人類所知的所有自然力量。風水術的誕生，其實是應古代【D】社會的生活和【E】所需，因為對古人來說，大自然是不容忽視的主宰力量。","blanks":[{"key":"A","answers":["晉"]},{"key":"B","answers":["葬書"]},{"key":"C","answers":["天地"]},{"key":"D","answers":["農業"]},{"key":"E","answers":["耕作"]}],"unordered":[]},{"id":"單元九-2","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":2,"text":"自古以來，中國建築物的佈局都與風水結下不解之緣。四方的庇護一般以【A】作象徵：前【B】、後【C】、左【D】、右白虎。","blanks":[{"key":"A","answers":["動物"]},{"key":"B","answers":["朱雀"]},{"key":"C","answers":["玄武"]},{"key":"D","answers":["青龍"]}],"unordered":[]},{"id":"單元九-3","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":3,"text":"香港第一條被建造的道路是【A】，早於【B】年開建。","blanks":[{"key":"A","answers":["皇后大道"]},{"key":"B","answers":["1841"]}],"unordered":[]},{"id":"單元九-4","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":4,"text":"香港有些大廈和建築物是有別名的，如西港城叫【A】；太空館叫【B】；土瓜灣市政大廈叫【C】；匯豐銀行大廈叫【D】。","blanks":[{"key":"A","answers":["紅街市"]},{"key":"B","answers":["菠蘿包"]},{"key":"C","answers":["紅蘋果"]},{"key":"D","answers":["機械人"]}],"unordered":[]},{"id":"單元九-5","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":5,"text":"香港有些大廈和建築物是有別名的，如西區警署叫【A】；油麻地水果批發市場叫【B】；佛堂門天后廟叫【C】。","blanks":[{"key":"A","answers":["七號差館"]},{"key":"B","answers":["果欄"]},{"key":"C","answers":["大廟"]}],"unordered":[]},{"id":"單元九-6","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":6,"text":"九龍城福佬村道的得名，是因為此處曾有一條【A】村。","blanks":[{"key":"A","answers":["鶴佬"]}],"unordered":[]},{"id":"單元九-7","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":7,"text":"【A】有四盞香港僅存的1880年代煤氣街燈，是電影裡常見的經典浪漫場景拍攝場地。","blanks":[{"key":"A","answers":["都爹利街"]}],"unordered":[]},{"id":"單元九-8","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":8,"text":"香港有不少富豪都不惜以高價去競投自己喜歡的車輛登記號碼（俗稱車牌）。香港最貴的車牌是 “【A】”，於2021年以【B】萬港元成交。","blanks":[{"key":"A","answers":["W"]},{"key":"B","answers":["2,600"]}],"unordered":[]},{"id":"單元九-9","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":9,"text":"香港藝人【A】以25萬港元在自訂車牌公開競投中，投得與其英文名相同的車牌。","blanks":[{"key":"A","answers":["郭富城"]}],"unordered":[]},{"id":"單元九-10","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":10,"text":"1號車牌是【A】坐駕的車牌。","blanks":[{"key":"A","answers":["警務處處長"]}],"unordered":[]},{"id":"單元九-11","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":11,"text":"大帽山昔日稱為【A】；鳳凰山昔日稱為【B】；太平山昔日稱為【C】或【D】。","blanks":[{"key":"A","answers":["大霧山"]},{"key":"B","answers":["爛頭山"]},{"key":"C","answers":["硬頭山"]},{"key":"D","answers":["扯旗山"]}],"unordered":[["C","D"]]},{"id":"單元九-12","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":12,"text":"果洲群島被稱為【A】；長洲昔日稱為【B】；南丫島古稱為【C】。","blanks":[{"key":"A","answers":["九柱群島"]},{"key":"B","answers":["啞鈴島"]},{"key":"C","answers":["博寮洲","舶寮洲"]}],"unordered":[]},{"id":"單元九-13","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":13,"text":"21世紀初，香港開始出現大規模新【A】區和不少新建街道，街道命名由先擬定【B】文名為主漸漸變成先擬定【C】文為主。二十世紀早期，華人的地位開始變得重要，部份街道（如李陞街）取名於華人【D】。","blanks":[{"key":"A","answers":["填海"]},{"key":"B","answers":["英"]},{"key":"C","answers":["中"]},{"key":"D","answers":["富商"]}],"unordered":[]},{"id":"單元九-14","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":14,"text":"戰後的香港發展愈來愈快，有更多新街道成立。此時，街道的命名已經放棄用政府【A】的名字。街道命名變得多元化，包括: 以【B】、【C】、【D】和【E】文雅字詞命名。","blanks":[{"key":"A","answers":["官員"]},{"key":"B","answers":["植物"]},{"key":"C","answers":["建築物"]},{"key":"D","answers":["舊村落"]},{"key":"E","answers":["吉祥"]}],"unordered":[["B","C"]]},{"id":"單元九-15","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":15,"text":"列拿士地台當初命名是記一名叫【A】的人，但當時負責的師爺由於是中國人關係，習慣了由【B】書寫，最後將整個街道名的英文拼寫【C】了，使香港保留了這個十分特別的街道名。","blanks":[{"key":"A","answers":["亞歷山大"]},{"key":"B","answers":["右向左"]},{"key":"C","answers":["倒轉"]}],"unordered":[]},{"id":"單元九-16","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":16,"text":"緬甸台是錯誤的街道中文譯名，而且與東南亞國家緬甸是沒有關係的。其實緬甸台的英文名字源於該處曾有一批居民來自【A】城市 Minden，所以將該路段以Minden 來命名。Minden正式中文譯名為【B】，位於緬甸台側的【C】也可以證實這點。","blanks":[{"key":"A","answers":["德國"]},{"key":"B","answers":["棉登"]},{"key":"C","answers":["棉登徑"]}],"unordered":[]},{"id":"單元九-17","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":17,"text":"眾坊街英文名字是解作【A】的意思，然而命名的官員將 Square 解作【B】，所以幾十年前眾坊街被叫作「【C】街」。","blanks":[{"key":"A","answers":["公共廣場"]},{"key":"B","answers":["四方"]},{"key":"C","answers":["公眾四方"]}],"unordered":[]},{"id":"單元九-18","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":18,"text":"以「街市街」命名的街道出現於香港多個地區，包括；【A】、【B】、【C】、【D】及【E】。","blanks":[{"key":"A","answers":["油麻地"]},{"key":"B","answers":["沙頭角"]},{"key":"C","answers":["荃灣"]},{"key":"D","answers":["上環"]},{"key":"E","answers":["大澳"]}],"unordered":[["A","B","C","D","E"]]},{"id":"單元九-19","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":19,"text":"上環【A】及干諾道西一帶又被稱海味街，是香港最大的蔘茸海味等乾貨集散地。","blanks":[{"key":"A","answers":["德輔道西"]}],"unordered":[]},{"id":"單元九-20","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":20,"text":"砵典乍街建於1850年代，並以香港第一任【A】命名，又被稱為【B】。","blanks":[{"key":"A","answers":["總督"]},{"key":"B","answers":["石板街"]}],"unordered":[]},{"id":"單元九-21","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":21,"text":"青山公路元朗段貫穿元朗市中心，故又被稱為元朗【A】。","blanks":[{"key":"A","answers":["大馬路"]}],"unordered":[]},{"id":"單元九-22","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":22,"text":"香港最高的住宅大樓是位於【A】的天璽I 及 II。","blanks":[{"key":"A","answers":["西九龍"]}],"unordered":[]},{"id":"單元九-23","part":"第一部分：香港知識","unit":"單元九","unitTitle":"趣聞軼事及掌故","num":23,"text":"環球貿易廣場位於西九龍，樓高【A】米，是香港最高建築物。聳立於中區的【B】二期，樓高約415.8米，曾經是香港最高建築物。","blanks":[{"key":"A","answers":["484"]},{"key":"B","answers":["國際金融中心"]}],"unordered":[]},{"id":"單元十-1","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":1,"text":"粵港澳大灣區包括香港、澳門兩個特別行政區，以及廣東省廣州、【A】、珠海、【B】、惠州、【C】、中山、【D】、肇慶九市。","blanks":[{"key":"A","answers":["深圳"]},{"key":"B","answers":["佛山"]},{"key":"C","answers":["東莞"]},{"key":"D","answers":["江門"]}],"unordered":[["A","B","C","D"]]},{"id":"單元十-2","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":2,"text":"粵港澳大灣區地處沿海開放前沿，以泛【A】區域為廣闊發展腹地，在「【B】」建設中具有重要地位。","blanks":[{"key":"A","answers":["珠三角"]},{"key":"B","answers":["一帶一路"]}],"unordered":[]},{"id":"單元十-3","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":3,"text":"於【A】年12月3日公布的《粵港澳大灣區文化和旅遊發展規劃》，為大灣區的整體文化和旅遊發展提供指導性方向，引領大灣區成為中外文化的【B】及世界級旅遊目的地，","blanks":[{"key":"A","answers":["2020"]},{"key":"B","answers":["交流樞紐"]}],"unordered":[]},{"id":"單元十-4","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":4,"text":"香港旅遊業近年正朝產品【A】及【B】方向穩健發展，政府亦一直致力對外推廣「【C】」旅遊產品和加強香港作為亞洲區首選旅遊目的地的形象。","blanks":[{"key":"A","answers":["多元化"]},{"key":"B","answers":["高增值"]},{"key":"C","answers":["一程多站"]}],"unordered":[]},{"id":"單元十-5","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":5,"text":"港珠澳大橋是全球最長【A】組合跨海通道，大橋落成通車後，大大地改善了粵港澳大灣區城市之間的交通連接，將珠三角西部納入香港【B】小時車程可達範圍內。","blanks":[{"key":"A","answers":["橋隧"]},{"key":"B","answers":["三"]}],"unordered":[]},{"id":"單元十-6","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":6,"text":"廣深港高速鐵路只需約【A】分鐘便可由香港的西九龍站直達深圳福田、約18 分鐘可直達【B】站、約46 分鐘可直達【C】站，並可轉乘珠三角【D】快速軌道到達大灣區其他城巿。","blanks":[{"key":"A","answers":["14"]},{"key":"B","answers":["深圳北"]},{"key":"C","answers":["廣州南"]},{"key":"D","answers":["城際"]}],"unordered":[]},{"id":"單元十-7","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":7,"text":"20 世紀初，大量海外華工衣錦還鄉買地建屋，開平出現了許多規模宏偉的碉樓。碉樓並非傳統中式建築，而是將【A】、古羅馬、【B】、【C】與中式建築風格共冶一爐，而且結構堅固，具防澇防匪功能，完美糅合視覺美學與實用價值。","blanks":[{"key":"A","answers":["古希臘"]},{"key":"B","answers":["拜占庭"]},{"key":"C","answers":["巴洛克"]}],"unordered":[["A","B","C"]]},{"id":"單元十-8","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":8,"text":"晚清年間，廣州【A】在西關（今【B】區）一帶興建了許多華美大宅，統稱「西關大屋」。","blanks":[{"key":"A","answers":["富商"]},{"key":"B","answers":["茘灣"]}],"unordered":[]},{"id":"單元十-9","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":9,"text":"【A】是黃飛鴻出生的地方，武術迷可在此城市踏足還原現實的【B】及【C】等。","blanks":[{"key":"A","answers":["佛山"]},{"key":"B","answers":["寶芝林"]},{"key":"C","answers":["百草堂"]}],"unordered":[["B","C"]]},{"id":"單元十-10","part":"第二部分：中國知識","unit":"單元十","unitTitle":"粵港澳大灣區","num":10,"text":"鼎湖山為【A】四大名山之首，更是中國首個國家級自然保護區，區內林木繁茂，終年常綠。鼎湖山亦是【B】聖地，園區內建於明代的【C】是廣東四大名剎之一，五層殿宇內大小殿堂上百間，收藏不少歷史文物，包括難得一見的千人鑊、大銅鐘及【D】御賜牌匾等。","blanks":[{"key":"A","answers":["嶺南"]},{"key":"B","answers":["佛教"]},{"key":"C","answers":["慶雲寺"]},{"key":"D","answers":["慈禧"]}],"unordered":[]},{"id":"單元十一-1","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":1,"text":"在中國漫長的君王主義年代，【A】朝是最後的一個王朝，統治了中國達【B】年。","blanks":[{"key":"A","answers":["清"]},{"key":"B","answers":["268"]}],"unordered":[]},{"id":"單元十一-2","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":2,"text":"1894年爆發的【A】戰爭是中國近代史上一個轉折點，因為經此一役，滿清政府便一蹶不振。1895年中國戰敗給日本後簽訂了《【B】條約》，條約內容包括中國割讓【C】半島（後由中國附加三千萬兩白銀贖回）、割讓【D】島及【E】列島給日本。","blanks":[{"key":"A","answers":["甲午"]},{"key":"B","answers":["馬關"]},{"key":"C","answers":["遼東"]},{"key":"D","answers":["台灣"]},{"key":"E","answers":["澎湖"]}],"unordered":[]},{"id":"單元十一-3","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":3,"text":"在八國聯軍之役中，中國戰敗，聯軍佔領北京，被迫簽署了《【A】條約》，內容包括：賠款白銀【B】億五千萬両白銀；將東交民巷劃為「使館區」由使館管理，禁止中國人居住，成為國中之國；允許外國軍隊駐扎北京和【C】個重要地區等。","blanks":[{"key":"A","answers":["辛丑"]},{"key":"B","answers":["四"]},{"key":"C","answers":["12"]}],"unordered":[]},{"id":"單元十一-4","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":4,"text":"1911年10月10日晚，以孫中山為代表的革命派發動了【A】起義，並迅速席捲了大半個中國。1912年1月1日，孫中山在【B】宣誓就任臨時【C】，中國政治制度由封建主義走向【D】。","blanks":[{"key":"A","answers":["武昌"]},{"key":"B","answers":["南京"]},{"key":"C","answers":["大總統"]},{"key":"D","answers":["共和"]}],"unordered":[]},{"id":"單元十一-5","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":5,"text":"1915年底，【A】妄想復辟帝制，以1916 年為 「【B】元年」，但做了【C】天皇帝後便死亡，中國開始進入【D】分裂期。","blanks":[{"key":"A","answers":["袁世凱"]},{"key":"B","answers":["洪憲"]},{"key":"C","answers":["80"]},{"key":"D","answers":["南北"]}],"unordered":[]},{"id":"單元十一-6","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":6,"text":"中國共產黨於【A】年7月成立。","blanks":[{"key":"A","answers":["1921"]}],"unordered":[]},{"id":"單元十一-7","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":7,"text":"1931年9月18日深夜，【A】軍炸毁中國東北瀋陽近南滿一段鐵路，並反稱是中國軍隊破壞，佔領了瀋陽城，史稱「【B】」。","blanks":[{"key":"A","answers":["日本"]},{"key":"B","answers":["九一八事變"]}],"unordered":[]},{"id":"單元十一-8","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":8,"text":"1936年，張學良、楊虎城為迫蔣介石停止內戰聯共抗日，於是在1936年12月12日，採取一次軍事行動，史稱為「【A】事變」。","blanks":[{"key":"A","answers":["西安"]}],"unordered":[]},{"id":"單元十一-9","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":9,"text":"自1931年日本開始侵華戰爭起計，中國陷入漫長的【A】年抗日之戰。","blanks":[{"key":"A","answers":["14"]}],"unordered":[]},{"id":"單元十一-10","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":10,"text":"1945年日本戰敗，中國最後雖獲得勝利，卻旋即陷入【A】。","blanks":[{"key":"A","answers":["國共內戰"]}],"unordered":[]},{"id":"單元十一-11","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":11,"text":"1945年，《聯合國憲章》正式生效，聯合國正式成立。中國是聯合國的其中一個【A】國，又是【B】五大常任理事國之一，突顯出中國已躋身世界最大國際組織。","blanks":[{"key":"A","answers":["創始"]},{"key":"B","answers":["安全理事會"]}],"unordered":[]},{"id":"單元十一-12","part":"第二部分：中國知識","unit":"單元十一","unitTitle":"中國近代史","num":12,"text":"【A】年，中華人民共和國正式建立，標誌著中國進入【B】主義時代。","blanks":[{"key":"A","answers":["1949"]},{"key":"B","answers":["社會"]}],"unordered":[]},{"id":"單元十二-1","part":"第二部分：中國知識","unit":"單元十二","unitTitle":"中國的政治地理","num":1,"text":"中國面積約【A】萬平方公里，居世界第【B】位。","blanks":[{"key":"A","answers":["960"]},{"key":"B","answers":["3"]}],"unordered":[]},{"id":"單元十二-2","part":"第二部分：中國知識","unit":"單元十二","unitTitle":"中國的政治地理","num":2,"text":"根據中華人民共和國國家統計局，截至2024年年末，中國大陸人口總數超過【A】億人，居世界首位。","blanks":[{"key":"A","answers":["14"]}],"unordered":[]},{"id":"單元十二-3","part":"第二部分：中國知識","unit":"單元十二","unitTitle":"中國的政治地理","num":3,"text":"中國有【A】個省，【B】個直轄巿，【C】個自治區和【D】個特別行政區。","blanks":[{"key":"A","answers":["23"]},{"key":"B","answers":["4"]},{"key":"C","answers":["5"]},{"key":"D","answers":["2"]}],"unordered":[]},{"id":"單元十二-4","part":"第二部分：中國知識","unit":"單元十二","unitTitle":"中國的政治地理","num":4,"text":"中國的四個直轄巿包括：【A】、【B】、【C】和【D】。","blanks":[{"key":"A","answers":["北京"]},{"key":"B","answers":["上海"]},{"key":"C","answers":["重慶"]},{"key":"D","answers":["天津"]}],"unordered":[["A","B","C","D"]]},{"id":"單元十二-5","part":"第二部分：中國知識","unit":"單元十二","unitTitle":"中國的政治地理","num":5,"text":"中國的五個自治區包括：內【A】自治區、廣西【B】族自治區、寧夏【C】族自治區、新疆【D】自治區和【E】自治區。","blanks":[{"key":"A","answers":["蒙古"]},{"key":"B","answers":["壯"]},{"key":"C","answers":["回"]},{"key":"D","answers":["維吾爾"]},{"key":"E","answers":["西藏"]}],"unordered":[]},{"id":"單元十二-6","part":"第二部分： <script>

function importProgress(file, done){
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !d.blanks) throw new Error("格式不符");
      P = normalizeState(d); P.updatedAt = Date.now();
      try{ localStorage.setItem(LS, JSON.stringify(P)); }catch(e){}
      done(null);
    }catch(e){ done("檔案讀不到進度資料，請選擇之前匯出的 JSON 檔。"); }
  };
  r.onerror = function(){ done("檔案讀取失敗。"); };
  r.readAsText(file);
}

/* ============================ 答案比對 ============================ */
function norm(s){
  s = String(s == null ? "" : s);
  s = s.replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  s = s.replace(/\s+/g, "");
  s = s.replace(/[,.;:!?'"`~+\-_/\\()\[\]<>*=|]/g, "");
  s = s.replace(/[，。、；：！？「」『』（）【】《》〈〉～－—…·]/g, "");
  return s.toUpperCase();
}
function matches(blank, val){
  var n = norm(val);
  if(!n) return false;
  for(var i=0;i<blank.answers.length;i++){ if(norm(blank.answers[i]) === n) return true; }
  return false;
}
/* 逐格批改，並處理「答案無需依次序」的題目 */
function grade(q, ans){
  var res = {}, i, j;
  var groups = q.unordered || [];
  var grouped = {};
  groups.forEach(function(g){ g.forEach(function(k){ grouped[k] = true; }); });

  q.blanks.forEach(function(b){
    if(!grouped[b.key]) res[b.key] = {ok: matches(b, ans[b.key]), exp: b.answers};
  });

  groups.forEach(function(g){
    var blanks = g.map(function(k){ return q.blanks.filter(function(b){ return b.key === k; })[0]; });
    var used = blanks.map(function(){ return false; });
    var hit = g.map(function(){ return false; });
    for(i=0;i<g.length;i++){
      var val = ans[g[i]];
      if(!norm(val)) continue;
      for(j=0;j<blanks.length;j++){
        if(!used[j] && blanks[j] && matches(blanks[j], val)){ used[j] = true; hit[i] = true; break; }
      }
    }
    for(i=0;i<g.length;i++){
      res[g[i]] = {ok: hit[i], exp: blanks[i] ? blanks[i].answers : [], group: g};
    }
  });
  return res;
}
function record(q, res){
  var t = Date.now(), ok = 0, total = 0;
  q.blanks.forEach(function(b){
    var r = res[b.key], rec = blankRec(q.id + ":" + b.key);
    if(r && r.ok){ rec.c++; ok++; } else { rec.w++; }
    rec.l = (r && r.ok) ? 1 : 0; rec.t = t; total++;
  });
  var qr = P.questions[q.id] || (P.questions[q.id] = {n:0, t:0, lastOk:0});
  qr.n++; qr.t = t; qr.lastOk = (ok === total) ? 1 : 0;
  save();
  return {ok:ok, total:total};
}

/* ============================ 統計輔助 ============================ */
function unitStat(u){
  var blanks = 0, att = 0, c = 0, w = 0;
  u.qs.forEach(function(q){
    q.blanks.forEach(function(b){
      blanks++;
      var r = P.blanks[q.id + ":" + b.key];
      if(r && (r.c + r.w) > 0){ att++; c += r.c; w += r.w; }
    });
  });
  return {blanks:blanks, att:att, c:c, w:w, acc:(c+w) ? c/(c+w) : null, cov: blanks ? att/blanks : 0};
}
function overall(){
  var att = 0, c = 0, w = 0;
  Object.keys(P.blanks).forEach(function(k){
    var r = P.blanks[k];
    if(r.c + r.w > 0){ att++; c += r.c; w += r.w; }
  });
  return {att:att, c:c, w:w, acc:(c+w) ? c/(c+w) : null};
}
function wrongQueue(){
  return Q.filter(function(q){
    for(var i=0;i<q.blanks.length;i++){
      var r = P.blanks[q.id + ":" + q.blanks[i].key];
      if(r && r.l === 0) return true;
    }
    return false;
  });
}
function tier(acc){
  if(acc == null) return "";
  if(acc < 0.5) return "t1";
  if(acc < 0.75) return "t2";
  if(acc < 0.9) return "t3";
  return "t4";
}
function tierColor(acc){
  if(acc == null) return "var(--ink-3)";
  if(acc < 0.5) return "var(--bad)";
  if(acc < 0.75) return "var(--warn)";
  if(acc < 0.9) return "var(--harbour)";
  return "var(--ok)";
}
function pct(x){ return x == null ? "—" : Math.round(x*100) + "%"; }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
var armed = null;
function armConfirm(btn, label, fn){
  if(armed && armed.btn === btn){
    clearTimeout(armed.timer); btn.textContent = armed.text; armed = null;
    fn(); return;
  }
  if(armed){ clearTimeout(armed.timer); armed.btn.textContent = armed.text; }
  var original = btn.textContent;
  btn.textContent = label;
  armed = {btn:btn, text:original, timer:setTimeout(function(){
    btn.textContent = original; armed = null;
  }, 4000)};
}
var TOUCH = !!(window.matchMedia && window.matchMedia("(hover: none)").matches);
function slotMin(){ return window.innerWidth < 700 ? 4.6 : 6.6; }
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* 干擾項：只從同類型（數字／中文數字／名詞）的答案中挑，
   並優先選填空後綴相同（例如同樣接「年」「米」「街」）、字尾類別相同、長度相近的，
   讓選項真的有混淆作用，而不是一眼就能排除。 */
var CTX = null;
function answerType(v){
  if(/^[0-9][0-9,]*(\.[0-9]+)?$/.test(v)) return "num";
  if(/^[一二三四五六七八九十百千兩零]+$/.test(v)) return "cn";
  return "txt";
}
function buildCtx(){
  CTX = [];
  Q.forEach(function(q){
    q.blanks.forEach(function(b){
      // 後綴要是實字才有意義：標點（「，因為…」）誰後面都可能有，拿來比對只會亂加分
      var at = q.text.indexOf("【" + b.key + "】");
      var suf = at < 0 ? "" : q.text.slice(at + 3, at + 5);
      if (suf && /^[，。、；：！？（）「」『』《》〈〉…·\s]/.test(suf)) suf = "";
      var v = b.answers[0];
      CTX.push({
        qid:q.id, unit:q.unit, part:q.part, v:v, n:norm(v),
        type:answerType(v), suf:suf,
        tail:v.slice(-1), head:v.charAt(0), len:v.length,
        digits:v.replace(/[^0-9]/g, "").length
      });
    });
  });
}
function distractorScore(c, a){
  if(c.type !== a.type) return -1;
  var sc = 3;
  if(c.suf && a.suf){
    if(c.suf === a.suf) sc += 5;
    else if(c.suf.charAt(0) === a.suf.charAt(0)) sc += 3;
    else sc -= 2;
  }
  if(c.type === "num"){
    var isYear = function(v){ return /^(1[6-9]|20)[0-9]{2}$/.test(v); };
    if(isYear(c.v) !== isYear(a.v)) sc -= 5;   // 年份不要拿來混淆數量、金額
    if(c.digits === a.digits) sc += 3;
    else if(Math.abs(c.digits - a.digits) === 1) sc += 1;
  }else{
    if(c.tail === a.tail) sc += 4;
    if(Math.abs(c.len - a.len) <= 1) sc += 2;
    else if(Math.abs(c.len - a.len) === 2) sc += 1;
    if(c.head === a.head) sc += 1;
  }
  return sc;
}
function buildTray(q){
  if(!CTX) buildCtx();
  var correct = q.blanks.map(function(b){ return b.answers[0]; });
  var need = Math.max(4, correct.length) - correct.length;
  if(need <= 0){ study.tray = shuffle(correct.slice()); return; }

  var mine = CTX.filter(function(c){ return c.qid === q.id; });
  var seen = {};
  q.blanks.forEach(function(b){
    b.answers.forEach(function(a){ seen[norm(a)] = true; });
  });

  var cand = [];
  CTX.forEach(function(c){
    if(c.qid === q.id || seen[c.n]) return;
    var best = -1;
    for(var i=0;i<mine.length;i++){
      var sc = distractorScore(c, mine[i]);
      if(sc > best) best = sc;
    }
    if(best < 0) return;
    if(c.unit === q.unit) best += 2;
    else if(c.part === q.part) best += 1;
    seen[c.n] = true;
    cand.push({v:c.v, score:best + Math.random()*0.9});
  });
  cand.sort(function(a, b){ return b.score - a.score; });
  study.tray = shuffle(correct.concat(cand.slice(0, need).map(function(o){ return o.v; })));
}

function feedbackHTML(q){

  return '<div class="card lift"><div class="stack">' +

      '<div><div class="tilenum" style="color:' + tierColor(acc) + '">' + pct(acc) + '</div><div class="tilelabel">答對率</div></div>' +
      '<div><div class="tilenum">' + study.run.ok + " / " + study.run.total + '</div><div class="tilelabel">答對格數</div></div>' +
      '<div><div class="tilenum">' + study.run.answered + '</div><div class="tilelabel">已答題數</div></div>' +
    "</div>" +
    '<div class="actions"><button class="btn btn-primary" data-act="again">再練一輪</button>' +
    '<button class="btn" data-act="wrongscope">練習錯題（' + wrongQueue().length + '）</button>' +
